<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#4F46E5" />
<meta name="description" content="GEMBIRA - Sistem Pencatatan Perilaku Siswa SDN 1 Godegan" />
<meta name="color-scheme" content="light" />
<title>GEMBIRA - SDN 1 Godegan</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234F46E5'/%3E%3Ctext x='50' y='68' font-size='58' font-weight='800' text-anchor='middle' fill='white' font-family='Inter,sans-serif'%3EG%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234F46E5'/%3E%3Ctext x='50' y='68' font-size='58' font-weight='800' text-anchor='middle' fill='white' font-family='Inter,sans-serif'%3EG%3C/text%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" />
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
:root{
  --primary:#4F46E5; --primary-dark:#4338CA; --primary-light:#EEF2FF;
  --positive:#10B981; --positive-dark:#059669; --positive-bg:#D1FAE5;
  --negative:#F43F5E; --negative-dark:#BE123C; --negative-bg:#FFE4E6;
  --bg:#F9FAFB; --surface:#FFFFFF; --surface-alt:#F3F4F6;
  --text:#111827; --text-muted:#6B7280; --border:#E5E7EB;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.1);
  --shadow-lg:0 20px 25px -5px rgba(17,24,39,.12);
  --radius:16px; --radius-sm:10px;
  --transition:.18s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%,#E0E7FF 0%,#F3F4F6 38%,#F3F4F6 100%)}
body.sheet-open{overflow:hidden}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:10px}
*{scrollbar-width:thin;scrollbar-color:var(--primary) transparent}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeInTab{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-100%);opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes backdropIn{from{opacity:0}to{opacity:1}}

#app{width:100%;height:100%;max-width:720px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.tab-pane{display:none;animation:fadeInTab .25s ease-out}
.tab-pane.active{display:block}

.spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin .8s linear infinite;flex-shrink:0}
.spinner-dark{border-color:rgba(79,70,229,.2);border-top-color:var(--primary)}
.btn-loading{color:transparent!important;pointer-events:none;position:relative}
.btn-loading .spinner{position:absolute;top:50%;left:50%;margin:-10px 0 0 -10px}

.login-wrapper{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:1.2rem;background:var(--surface);text-align:center;overflow-y:auto;gap:.4rem;animation:fadeIn .3s}
.logo-box{position:relative;width:min(180px,55vw);aspect-ratio:1;max-width:200px;min-width:100px;background:linear-gradient(135deg,var(--primary),#818CF8);border-radius:24px;display:flex;justify-content:center;align-items:center;color:#fff;overflow:hidden;flex-shrink:0}
.logo-box .material-symbols-outlined{font-size:clamp(48px,15vw,72px);opacity:.2;z-index:1}
.logo-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--surface);padding:10%;z-index:2}
.app-subtitle{font-size:clamp(.9rem,4vw,1.1rem);color:var(--text-muted);margin-bottom:.6rem;line-height:1.2}
.input-modern{width:100%;padding:.85rem 1rem;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:clamp(.9rem,2.5vw,1rem);background:var(--bg);transition:var(--transition);outline:none}
.input-modern:focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 4px var(--primary-light)}
.btn-modern{width:100%;padding:.85rem;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:clamp(.9rem,2.5vw,1rem);font-weight:600;transition:var(--transition);display:inline-flex;justify-content:center;align-items:center;gap:.5rem;min-height:44px}
.btn-modern:hover:not(:disabled){background:var(--primary-dark)}
.btn-modern:active:not(:disabled){transform:scale(.98)}
.btn-modern:disabled{opacity:.7;cursor:not-allowed}
.login-desc-box{margin-top:1rem;padding:1rem;background:var(--primary-light);border:1px dashed #A5B4FC;border-radius:var(--radius-sm);text-align:left;width:100%}
.login-desc-box h3{font-size:clamp(.8rem,2vw,.9rem);color:var(--primary-dark);margin-bottom:.3rem;display:flex;align-items:center;gap:.3rem}
.login-desc-box p{font-size:clamp(.75rem,2vw,.85rem);color:var(--text-muted);line-height:1.5}

.app-header{background:var(--surface);padding:.9rem 1.2rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.app-header h1{font-size:clamp(1rem,3vw,1.15rem);font-weight:800;color:var(--primary);display:flex;align-items:center;gap:.5rem}
.header-logo{position:relative;width:clamp(28px,4vw,36px);height:clamp(28px,4vw,36px);border-radius:9px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--primary-light);flex-shrink:0}
.header-logo .material-symbols-outlined{font-size:clamp(16px,2.5vw,22px);color:var(--primary)}
.header-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2px;background:#fff;z-index:2}
.btn-icon{background:transparent;border:none;color:var(--text-muted);padding:.4rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transition:var(--transition)}
.btn-icon:hover{background:var(--negative-bg);color:var(--negative)}

.main-content{flex:1;overflow-y:auto;padding:1.2rem 1.2rem 90px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

.greeting-section{margin-bottom:1.2rem}
.greeting-section h2{font-size:1.4rem;font-weight:700}
.greeting-section p{color:var(--text-muted);font-size:.9rem;margin-top:.2rem}
.filter-period{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.2rem;background:var(--surface);padding:.5rem .8rem;border-radius:var(--radius-sm);border:1px solid var(--border);align-items:center}
.filter-period .filter-label{font-size:.8rem;font-weight:600;color:var(--text-muted);margin-right:.2rem}
.filter-btn{background:transparent;border:1px solid transparent;padding:.3rem .8rem;border-radius:20px;font-size:.75rem;font-weight:500;color:var(--text-muted);transition:var(--transition)}
.filter-btn:hover{background:var(--primary-light);color:var(--primary)}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem;margin-bottom:1.5rem}
.stat-card{background:var(--surface);border-radius:var(--radius-sm);padding:1rem 1.2rem;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:var(--transition)}
.stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.stat-card .stat-number{font-size:1.8rem;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.stat-card .stat-label{font-size:.8rem;color:var(--text-muted);font-weight:500;display:flex;align-items:center;gap:.3rem}
.stat-card .stat-icon{font-size:20px;color:var(--primary)}
.stat-card.positif .stat-number{color:var(--positive)}
.stat-card.negatif .stat-number{color:var(--negative)}
.stat-card.primary .stat-number{color:var(--primary)}

.chart-container{background:var(--surface);border-radius:var(--radius-sm);padding:1.2rem;border:1px solid var(--border);margin-bottom:1.5rem;box-shadow:var(--shadow-sm)}
.chart-container .chart-title{font-weight:600;font-size:.95rem;margin-bottom:.8rem;display:flex;align-items:center;gap:.5rem}
.chart-wrapper{position:relative;height:220px}

.ranking-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:1.5rem}
@media(max-width:600px){.ranking-grid{grid-template-columns:1fr}}
.ranking-card{background:var(--surface);border-radius:var(--radius-sm);padding:1rem 1.2rem;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.ranking-card .ranking-title{font-weight:600;font-size:.9rem;margin-bottom:.8rem;display:flex;align-items:center;gap:.4rem}
.ranking-card .ranking-title .material-symbols-outlined{font-size:20px}
.ranking-card.top .ranking-title{color:var(--positive)}
.ranking-card.bottom .ranking-title{color:var(--negative)}
.ranking-item{display:flex;align-items:center;gap:.4rem;padding:.4rem 0;border-bottom:1px solid var(--border);font-size:.85rem}
.ranking-item:last-child{border-bottom:none}
.ranking-item .rank-number{font-weight:700;color:var(--text-muted);width:22px;flex-shrink:0;font-variant-numeric:tabular-nums}
.ranking-item .rank-name{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ranking-item .rank-class{font-size:.7rem;color:var(--text-muted);flex-shrink:0}
.ranking-item .rank-poin{font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums}
.ranking-item .rank-poin.positif{color:var(--positive)}
.ranking-item .rank-poin.negatif{color:var(--negative)}

.activity-section{background:var(--surface);border-radius:var(--radius-sm);padding:1.2rem;border:1px solid var(--border);box-shadow:var(--shadow-sm);margin-bottom:1.5rem}
.activity-section .section-title{font-weight:600;font-size:.95rem;margin-bottom:.8rem;display:flex;align-items:center;gap:.5rem}
.activity-item{display:flex;align-items:center;gap:.8rem;padding:.6rem 0;border-bottom:1px solid var(--border)}
.activity-item:last-child{border-bottom:none}
.activity-item .activity-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.activity-item .activity-icon.positif{background:var(--positive-bg);color:var(--positive)}
.activity-item .activity-icon.negatif{background:var(--negative-bg);color:var(--negative)}
.activity-item .activity-content{flex:1;min-width:0}
.activity-item .activity-content .activity-text{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.activity-item .activity-content .activity-text strong{font-weight:600}
.activity-item .activity-content .activity-time{font-size:.7rem;color:var(--text-muted)}
.activity-item .activity-poin{font-weight:700;font-size:.85rem;flex-shrink:0;font-variant-numeric:tabular-nums}
.activity-item .activity-poin.positif{color:var(--positive)}
.activity-item .activity-poin.negatif{color:var(--negative)}

.section-title{font-weight:700;font-size:clamp(1rem,3vw,1.2rem);margin-bottom:1.2rem;display:flex;align-items:center;gap:.5rem}
.form-group{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem}
.form-group label{font-size:clamp(.8rem,2.2vw,.9rem);font-weight:600}
input[type="text"],input[type="password"],input[type="number"],input[type="date"],textarea{width:100%;padding:.7rem .9rem;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:clamp(.85rem,2.2vw,.95rem);background:var(--surface);outline:none;transition:var(--transition);appearance:none}
input:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
textarea{min-height:80px;resize:vertical;line-height:1.5}
.radio-card-group{display:flex;gap:.8rem}
.radio-card{flex:1;border:1px solid var(--border);border-radius:var(--radius-sm);padding:.6rem .4rem;display:flex;align-items:center;justify-content:center;gap:.3rem;cursor:pointer;transition:var(--transition);font-weight:600;font-size:clamp(.8rem,2vw,.9rem);user-select:none}
.radio-card.selected-positif{background:var(--positive-bg);border-color:var(--positive);color:#065F46}
.radio-card.selected-negatif{background:var(--negative-bg);border-color:var(--negative);color:#9F1239}
.radio-card input{display:none}
.indikator-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.8rem;margin-top:.3rem}
.indikator-item{display:flex;align-items:flex-start;gap:.6rem;margin-bottom:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .15s}
.indikator-item:last-child{margin-bottom:0}
.indikator-item:hover{background:var(--primary-light)}
.indikator-item input[type="checkbox"]{width:18px;height:18px;min-width:18px;margin-top:2px;border-radius:4px;border:2px solid var(--border);transition:all .15s;appearance:none;-webkit-appearance:none;background:var(--surface);position:relative;flex-shrink:0;cursor:pointer}
.indikator-item input[type="checkbox"]:checked{background:var(--primary);border-color:var(--primary)}
.indikator-item input[type="checkbox"]:checked::after{content:"✓";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:13px;font-weight:700;line-height:1}
.indikator-item span{font-size:clamp(.8rem,2vw,.9rem);line-height:1.4;flex:1}

.toggle-group{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--border);padding:.8rem 1rem;border-radius:var(--radius-sm);gap:1rem;flex-direction:row}
.toggle-text{display:flex;flex-direction:column;flex:1}
.toggle-text label{font-size:clamp(.8rem,2vw,.9rem);font-weight:600;cursor:pointer}
.toggle-text .desc{font-size:clamp(.65rem,1.6vw,.75rem);color:var(--text-muted)}
.switch{position:relative;display:inline-block;width:48px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;inset:0;background:#CBD5E1;transition:.3s;border-radius:34px;cursor:pointer;box-shadow:inset 0 1px 3px rgba(0,0,0,.1)}
.slider::before{content:"";position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:#fff;transition:.3s;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch input:checked + .slider{background:var(--primary)}
.switch input:checked + .slider::before{transform:translateX(22px)}

.search-bar{display:flex;gap:.5rem;margin-bottom:1rem}
.search-bar input{flex:1;margin:0}
.profil-card{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:1rem;border-radius:var(--radius);margin-bottom:1.2rem;display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.profil-left{display:flex;align-items:center;gap:.7rem;min-width:0}
.avatar-circle{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(.9rem,2.5vw,1.1rem);flex-shrink:0}
.profil-info{min-width:0}
.profil-info .nama{font-weight:700;font-size:clamp(.9rem,2.5vw,1.05rem);margin-bottom:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profil-info .detail{font-size:clamp(.7rem,1.8vw,.8rem);opacity:.9}
.poin-total{text-align:right;flex-shrink:0}
.poin-total .angka{font-size:clamp(1.4rem,4vw,1.8rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.poin-total .label{font-size:clamp(.6rem,1.5vw,.7rem);opacity:.9;letter-spacing:.3px}

.filter-box{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1.2rem}
.filter-box input{padding:.6rem;font-size:clamp(.75rem,2vw,.85rem)}
.filter-box .cs-trigger{padding:.6rem .7rem;font-size:clamp(.75rem,2vw,.85rem)}
.filter-box .btn-modern{grid-column:span 2;padding:.6rem;font-size:clamp(.8rem,2vw,.9rem)}

.history-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:.8rem;box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s}
.history-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.hc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.hc-date{font-size:clamp(.7rem,1.8vw,.8rem);color:var(--text-muted);display:flex;align-items:center;gap:.2rem}
.hc-date .material-symbols-outlined{font-size:14px}
.badge{padding:.2rem .5rem;border-radius:20px;font-size:clamp(.65rem,1.6vw,.75rem);font-weight:700;font-variant-numeric:tabular-nums}
.badge.positif{background:var(--positive-bg);color:var(--positive)}
.badge.negatif{background:var(--negative-bg);color:var(--negative)}
.badge.netral{background:var(--surface-alt);color:var(--text-muted)}
.hc-kat{font-weight:700;margin-bottom:.2rem;font-size:clamp(.85rem,2.2vw,1rem)}
.hc-desc{font-size:clamp(.8rem,2vw,.9rem);color:var(--text-muted);margin-bottom:.6rem;line-height:1.4}
.hc-indikator{background:var(--bg);padding:.5rem .7rem;border-radius:8px;font-size:clamp(.7rem,1.8vw,.8rem);color:var(--text-muted);margin-bottom:.6rem;border-left:3px solid var(--primary)}
.hc-indikator ul{margin-left:1rem;margin-top:.1rem}
.hc-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--border);padding-top:.6rem;font-size:clamp(.7rem,1.8vw,.8rem);color:var(--text-muted)}

.empty-state{text-align:center;padding:2rem 1rem;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;gap:.8rem}
.empty-state .material-symbols-outlined{font-size:40px;opacity:.5}

.toast-container{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:90%;max-width:400px;pointer-events:none}
.toast{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem;border-radius:var(--radius-sm);color:#fff;font-size:clamp(.8rem,2vw,.9rem);font-weight:500;box-shadow:0 10px 15px -3px rgba(0,0,0,.1);animation:slideDown .35s cubic-bezier(.175,.885,.32,1.275) forwards;pointer-events:auto}
.toast.success{background:var(--positive)}
.toast.error{background:var(--negative)}
.toast.hide{animation:slideUp .3s ease-in forwards}

.bottom-nav{background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:.6rem 0;padding-bottom:max(.6rem,env(safe-area-inset-bottom));flex-shrink:0;z-index:10;box-shadow:0 -4px 6px -1px rgba(0,0,0,.03)}
.nav-item{background:transparent;border:none;display:flex;flex-direction:column;align-items:center;gap:.15rem;color:var(--text-muted);font-size:.7rem;font-weight:500;transition:var(--transition);padding:.2rem .8rem;min-width:60px}
.nav-item.active{color:var(--primary)}
.nav-item .material-symbols-outlined{font-size:22px;transition:var(--transition)}
.nav-item.active .material-symbols-outlined{font-variation-settings:'FILL' 1}

.custom-select{position:relative;width:100%}
.cs-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:.4rem;padding:.7rem .9rem;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:clamp(.85rem,2.2vw,.95rem);color:var(--text);transition:var(--transition);text-align:left;min-height:44px}
.cs-trigger:hover:not(.disabled){border-color:#C7D2FE}
.cs-trigger.active{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.cs-trigger.disabled{opacity:.6;cursor:not-allowed;background:var(--surface-alt)}
.cs-value{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-value.cs-placeholder{color:var(--text-muted);font-weight:400}
.cs-chevron{font-size:20px;color:var(--text-muted);transition:transform .2s;flex-shrink:0}
.cs-trigger.active .cs-chevron{transform:rotate(180deg);color:var(--primary)}

<body>
<div id="app"></div>
<div id="toastContainer" class="toast-container" aria-live="polite"></div>

<script>
'use strict';
(function(){

/* ==================== KONFIG ==================== */
const API_BASE      = 'https://script.google.com/macros/s/AKfycbwLO1-b90arkPSvm2Ip72rdBYdmXWfaVjucuxuPGWURovQkhwVXksNGC4Orl3VmzNwQ/exec';
const LOGO_URL      = 'https://raw.githubusercontent.com/sd1godegan/catatan/refs/heads/main/logo.png';
const CACHE_TTL     = 60_000;
const FETCH_TIMEOUT = 20_000;
const VERIFY_TTL    = 300_000;

/* ==================== UTIL ==================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const fmtDate = (s, opt = { day:'numeric', month:'short', year:'numeric' }) => {
  if (!s || s === '-') return '-';
  try { const d = new Date(s); return isNaN(d) ? '-' : d.toLocaleDateString('id-ID', opt); }
  catch { return '-'; }
};
const todayYMD = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const firstOfMonthYMD = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
};

/* ==================== SESSION STORAGE ==================== */
const SSKeys = {
  TOKEN: 'gembira_token',
  VERIFY_PREFIX: 'gembira_tv_',
  LEGACY: ['token', 'token_verified_at', 'token_verified_value']
};
function clearVerifyCache() {
  Object.keys(sessionStorage).forEach(k => {
    if (k.startsWith(SSKeys.VERIFY_PREFIX) || SSKeys.LEGACY.includes(k)) {
      sessionStorage.removeItem(k);
    }
  });
}
function clearAllSession() {
  sessionStorage.removeItem(SSKeys.TOKEN);
  SSKeys.LEGACY.forEach(k => sessionStorage.removeItem(k));
  clearVerifyCache();
}

/* ==================== TOAST ==================== */
function showToast(msg, type = 'success') {
  const c = $('#toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icon = type === 'success' ? 'check_circle' : 'error';
  t.innerHTML = `<span class="material-symbols-outlined">${icon}</span><span>${escapeHtml(msg)}</span>`;
  c.appendChild(t);
  setTimeout(() => { t.classList.add('hide'); setTimeout(() => t.remove(), 300); }, 3500);
}

/* ==================== BUTTON LOADING ==================== */
function setLoading(btn, on, text = '') {
  if (!btn) return;
  if (on) {
    if (!btn.dataset.orig) btn.dataset.orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> ${escapeHtml(text || 'Memuat...')}`;
    btn.classList.add('btn-loading');
  } else {
    btn.disabled = false;
    btn.classList.remove('btn-loading');
    if (btn.dataset.orig) { btn.innerHTML = btn.dataset.orig; delete btn.dataset.orig; }
  }
}

/* ==================== CLIENT CACHE ==================== */
const ClientCache = {
  _store: new Map(),
  _inflight: new Map(),
  get(k) {
    const e = this._store.get(k);
    if (!e) return null;
    if (Date.now() - e.t > CACHE_TTL) { this._store.delete(k); return null; }
    return e.v;
  },
  set(k, v) { this._store.set(k, { v, t: Date.now() }); },
  clear() { this._store.clear(); this._inflight.clear(); }
};

/* ==================== API ==================== */
const Api = {
  async request(action, body = {}, opts = {}) {
    const useCache = opts.cache !== false;
    const key = `api:${action}:${JSON.stringify(body)}`;

    if (useCache) {
      const hit = ClientCache.get(key);
      if (hit) return hit;
      if (ClientCache._inflight.has(key)) return ClientCache._inflight.get(key);
    }

    const token = sessionStorage.getItem(SSKeys.TOKEN);
    const payload = { ...body, ...(token ? { token } : {}) };
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT);

    const promise = (async () => {
      try {
        const res = await fetch(`${API_BASE}?action=${encodeURIComponent(action)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          signal: ctrl.signal
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data && data.error === 'Unauthorized') {
          clearAllSession();
          ClientCache.clear();
          setTimeout(() => location.reload(), 100);
          throw new Error('Unauthorized');
        }
        if (useCache && data && !data.error) ClientCache.set(key, data);
        return data;
      } finally {
        clearTimeout(timer);
        ClientCache._inflight.delete(key);
      }
    })();

    if (useCache) ClientCache._inflight.set(key, promise);
    return promise;
  },

  async verifyToken(token, force = false) {
    const sig = String(token).slice(0, 4) + '|' + String(token).length;
    const atKey  = SSKeys.VERIFY_PREFIX + 'at_' + sig;
    const valKey = SSKeys.VERIFY_PREFIX + 'val_' + sig;

    if (!force) {
      const at = parseInt(sessionStorage.getItem(atKey) || '0', 10);
      const val = sessionStorage.getItem(valKey);
      if (val && Date.now() - at < VERIFY_TTL) return val === '1';
    }

    try {
      const res = await fetch(`${API_BASE}?action=verify_token`, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ token })
      });
      const d = await res.json();
      const ok = d.valid === true;
      sessionStorage.setItem(atKey, String(Date.now()));
      sessionStorage.setItem(valKey, ok ? '1' : '0');
      return ok;
    } catch { return false; }
  },

  bootstrap:     () => Api.request('get_bootstrap'),
  getKelas:      () => Api.request('get_kelas'),
  getSiswaKelas: (kelas) => Api.request('get_siswa_by_kelas', { kelas }),
  cariSiswa:     (query) => Api.request('cari_siswa', { query }),
  dashboard:     (period) => Api.request('get_dashboard_data', { period }),
  riwayat:       (id, filter = {}) => Api.request('get_riwayat_siswa', { id_siswa: id, ...filter }, { cache: false }),
  laporan:       (kelas, a, b, nonaktif = false) =>
                   Api.request('get_laporan_kelas',
                     { kelas, tgl_mulai: a, tgl_sampai: b, include_nonaktif: nonaktif },
                     { cache: false }),
  addPerilaku:   (data) => { ClientCache.clear(); return Api.request('add_perilaku', data, { cache: false }); }
};

/* ==================== CUSTOM SELECT ==================== */
class CustomSelect {
  static _bound = false;
  constructor(wrapId, opts = {}) {
    this.wrap = document.getElementById(wrapId);
    if (!this.wrap) return;
    this.placeholder = opts.placeholder || '-- Pilih --';
    this.onChange = opts.onChange || null;
    this.searchable = !!opts.searchable;
    this.options = [];
    this.value = '';
    this.disabled = false;
    this.isOpen = false;
    this._build();
  }
  _build() {
    this.wrap.classList.add('custom-select');
    this.wrap.innerHTML = `
      <button type="button" class="cs-trigger" aria-haspopup="listbox" aria-expanded="false">
        <span class="cs-value cs-placeholder">${escapeHtml(this.placeholder)}</span>
        <span class="material-symbols-outlined cs-chevron">expand_more</span>
      </button>
      <div class="cs-panel" role="listbox">
        ${this.searchable ? `<div class="cs-search"><input type="text" class="cs-search-input" placeholder="Cari..."></div>` : ''}
        <div class="cs-options"></div>
      </div>`;
    this.trigger = $('.cs-trigger', this.wrap);
    this.valueEl = $('.cs-value', this.wrap);
    this.panel   = $('.cs-panel', this.wrap);
    this.optionsEl = $('.cs-options', this.wrap);
    this.searchInput = $('.cs-search-input', this.wrap);

    this.trigger.addEventListener('click', e => { e.stopPropagation(); if (!this.disabled) this.toggle(); });
    this.trigger.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!this.disabled) this.toggle(); }
      else if (e.key === 'Escape') this.close();
    });
    if (this.searchInput) {
      this.searchInput.addEventListener('input', () => this._filter());
      this.searchInput.addEventListener('click', e => e.stopPropagation());
    }
    if (!CustomSelect._bound) {
      document.addEventListener('click', () => {
        $$('.custom-select').forEach(el => el._cs?.close());
      });
      CustomSelect._bound = true;
    }
    this.wrap._cs = this;
  }
  setOptions(opts, placeholder) {
    this.options = opts || [];
    if (placeholder !== undefined) this.placeholder = placeholder;
    if (!this.options.length) {
      this.optionsEl.innerHTML = `<div class="cs-empty">Tidak ada data</div>`;
    } else {
      this.optionsEl.innerHTML = this.options.map(o =>
        `<div class="cs-option" data-value="${escapeHtml(String(o.value))}" role="option">${escapeHtml(o.label)}</div>`
      ).join('');
      this.optionsEl.onclick = e => {
        const el = e.target.closest('.cs-option');
        if (!el) return;
        const opt = this.options.find(o => String(o.value) === el.dataset.value);
        if (!opt) return;
        this.setValue(opt.value, opt.label);
        this.close();
        this.onChange?.(opt.value, opt);
      };
    }
    this.setValue('', this.placeholder);
  }
  _filter() {
    const q = this.searchInput.value.toLowerCase();
    let any = false;
    $$('.cs-option', this.optionsEl).forEach(el => {
      const m = el.textContent.toLowerCase().includes(q);
      el.style.display = m ? '' : 'none';
      if (m) any = true;
    });
    let empty = $('.cs-empty-search', this.optionsEl);
    if (!any && !empty) {
      empty = document.createElement('div');
      empty.className = 'cs-empty cs-empty-search';
      empty.textContent = 'Tidak ditemukan';
      this.optionsEl.appendChild(empty);
    } else if (any && empty) empty.remove();
  }
  setValue(value, label) {
    this.value = value;
    const has = value !== '' && value != null;
    this.valueEl.textContent = has ? label : this.placeholder;
    this.valueEl.classList.toggle('cs-placeholder', !has);
    $$('.cs-option', this.optionsEl).forEach(el => {
      el.classList.toggle('selected', has && el.dataset.value === String(value));
    });
  }
  getValue() { return this.value; }
  open() {
    if (this.disabled) return;
    $$('.custom-select').forEach(el => { if (el._cs && el._cs !== this) el._cs.close(); });
    this.isOpen = true;
    this.panel.classList.add('open');
    this.trigger.classList.add('active');
    this.trigger.setAttribute('aria-expanded', 'true');
    if (this.searchInput) {
      this.searchInput.value = '';
      this._filter();
      requestAnimationFrame(() => this.searchInput.focus());
    }
  }
  close() {
    this.isOpen = false;
    this.panel.classList.remove('open');
    this.trigger.classList.remove('active');
    this.trigger.setAttribute('aria-expanded', 'false');
  }
  toggle() { this.isOpen ? this.close() : this.open(); }
  disable() { this.disabled = true; this.trigger.classList.add('disabled'); this.close(); }
  enable()  { this.disabled = false; this.trigger.classList.remove('disabled'); }
}

/* ==================== CATEGORY SHEET ==================== */
class CategorySheet {
  constructor(opts = {}) {
    this.onSelect = opts.onSelect || null;
    this.kategori = [];      // full list
    this.jenis = 'Positif';  // filter aktif
    this.tab = 'all';        // 'all' | 'umum' | 'disiplin'
    this.query = '';
    this.selectedId = null;
    this._build();
  }

  _build() {
    if (document.getElementById('katSheetBackdrop')) return;
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="sheet-backdrop" id="katSheetBackdrop"></div>
      <div class="sheet" id="katSheet" role="dialog" aria-modal="true" aria-labelledby="katSheetTitle">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <h3 id="katSheetTitle">Pilih Kategori</h3>
          <button class="btn-icon" id="katSheetClose" aria-label="Tutup">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="sheet-tabs" id="katSheetTabs">
          <button class="sheet-tab active" data-tab="all">Semua</button>
          <button class="sheet-tab" data-tab="umum">
            <span class="material-symbols-outlined" style="font-size:14px">category</span> Umum
          </button>
          <button class="sheet-tab" data-tab="disiplin">
            <span class="material-symbols-outlined" style="font-size:14px">school</span> Kedisiplinan
          </button>
        </div>
        <div class="sheet-search">
          <span class="material-symbols-outlined">search</span>
          <input type="text" id="katSheetSearch" placeholder="Cari kategori..." autocomplete="off">
        </div>
        <div class="sheet-body" id="katSheetBody"></div>
      </div>`;
    document.body.appendChild(wrap);

    this.backdrop = document.getElementById('katSheetBackdrop');
    this.sheet    = document.getElementById('katSheet');
    this.bodyEl   = document.getElementById('katSheetBody');
    this.searchEl = document.getElementById('katSheetSearch');
    this.tabsEl   = document.getElementById('katSheetTabs');

    // Events
    this.backdrop.onclick = () => this.close();
    document.getElementById('katSheetClose').onclick = () => this.close();
    this.tabsEl.onclick = e => {
      const btn = e.target.closest('.sheet-tab');
      if (!btn) return;
      this.tab = btn.dataset.tab;
      $$('.sheet-tab', this.tabsEl).forEach(t => t.classList.toggle('active', t === btn));
      this._render();
    };
    this.searchEl.addEventListener('input', debounce(() => {
      this.query = this.searchEl.value.trim().toLowerCase();
      this._render();
    }, 150));

    // Escape to close
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && this.isOpen()) this.close();
    });
  }

  isOpen() { return this.sheet?.classList.contains('open'); }

  // Set data & open
  open(kategori, jenis, selectedId) {
    this.kategori = Array.isArray(kategori) ? kategori : [];
    this.jenis = jenis || 'Positif';
    this.selectedId = selectedId != null ? selectedId : null;
    this.tab = 'all';
    this.query = '';
    if (this.searchEl) this.searchEl.value = '';
    $$('.sheet-tab', this.tabsEl).forEach((t, i) => t.classList.toggle('active', i === 0));
    this._render();
    document.body.classList.add('sheet-open');
    // Force reflow → animate
    requestAnimationFrame(() => {
      this.backdrop.classList.add('open');
      this.sheet.classList.add('open');
    });
    // Auto-focus search on desktop only (mobile keyboard often blocks view)
    if (window.matchMedia('(hover:hover)').matches) {
      setTimeout(() => this.searchEl?.focus(), 320);
    }
  }

  close() {
    this.backdrop?.classList.remove('open');
    this.sheet?.classList.remove('open');
    document.body.classList.remove('sheet-open');
  }

  _isDisiplin(k) {
    const id = Number(k.id);
    if (Number.isFinite(id)) return id >= 15;
    // fallback: deteksi dari nama
    return /disiplin|terlambat|pr|tugas|atribut|upacara|piket|sampah|tidur|keluar kelas/i.test(k.nama_kategori || '');
  }

  _filtered() {
    let list = this.kategori.filter(k => k.jenis === this.jenis);
    // Tab filter
    if (this.tab === 'umum')     list = list.filter(k => !this._isDisiplin(k));
    if (this.tab === 'disiplin') list = list.filter(k =>  this._isDisiplin(k));
    // Query filter
    if (this.query) {
      list = list.filter(k => {
        const hay = (k.nama_kategori + ' ' + (k.indikator || []).join(' ')).toLowerCase();
        return hay.includes(this.query);
      });
    }
    // Urut: Umum dulu, lalu Kedisiplinan; dalam grup urut by nama
    list.sort((a, b) => {
      const da = this._isDisiplin(a) ? 1 : 0;
      const db = this._isDisiplin(b) ? 1 : 0;
      if (da !== db) return da - db;
      return String(a.nama_kategori).localeCompare(String(b.nama_kategori), 'id');
    });
    return list;
  }

  _render() {
    // Update count badges on tabs
    const all = this.kategori.filter(k => k.jenis === this.jenis);
    const umum = all.filter(k => !this._isDisiplin(k)).length;
    const disiplin = all.filter(k => this._isDisiplin(k)).length;
    const tabBtns = $$('.sheet-tab', this.tabsEl);
    if (tabBtns[0]) tabBtns[0].innerHTML = `Semua <span class="count">(${all.length})</span>`;
    if (tabBtns[1]) tabBtns[1].innerHTML = `<span class="material-symbols-outlined" style="font-size:14px">category</span> Umum <span class="count">(${umum})</span>`;
    if (tabBtns[2]) tabBtns[2].innerHTML = `<span class="material-symbols-outlined" style="font-size:14px">school</span> Kedisiplinan <span class="count">(${disiplin})</span>`;

    const list = this._filtered();
    if (!list.length) {
      this.bodyEl.innerHTML = `
        <div class="sheet-empty">
          <span class="material-symbols-outlined">search_off</span>
          <p>Tidak ada kategori yang cocok.</p>
        </div>`;
      return;
    }

    // Group visual (only if tab = 'all')
    let html = '';
    if (this.tab === 'all') {
      const umumList = list.filter(k => !this._isDisiplin(k));
      const disipList = list.filter(k => this._isDisiplin(k));
      if (umumList.length) {
        html += `<div class="group-title"><span class="material-symbols-outlined" style="font-size:14px">category</span> Perilaku Umum</div>`;
        html += `<div class="sheet-grid">${umumList.map(k => this._cardHtml(k)).join('')}</div>`;
      }
      if (disipList.length) {
        html += `<div class="group-title"><span class="material-symbols-outlined" style="font-size:14px">school</span> Kedisiplinan</div>`;
        html += `<div class="sheet-grid">${disipList.map(k => this._cardHtml(k)).join('')}</div>`;
      }
    } else {
      html += `<div class="sheet-grid">${list.map(k => this._cardHtml(k)).join('')}</div>`;
    }
    this.bodyEl.innerHTML = html;

    // Bind click
    $$('.kat-card', this.bodyEl).forEach(card => {
      card.onclick = () => {
        const id = card.dataset.id;
        const kat = this.kategori.find(k => String(k.id) === id);
        if (!kat) return;
        this.selectedId = kat.id;
        this.close();
        this.onSelect?.(kat);
      };
    });
  }

  _cardHtml(k) {
    const isDis = this._isDisiplin(k);
    const poin = Number(k.poin_default) || 0;
    const sign = poin > 0 ? '+' : '';
    const poinCls = poin > 0 ? 'pos' : (poin < 0 ? 'neg' : '');
    const indCount = (k.indikator || []).length;
    const selected = this.selectedId != null && String(this.selectedId) === String(k.id);
    return `<button type="button" class="kat-card${selected ? ' selected' : ''}" data-id="${escapeHtml(String(k.id))}">
      <div class="kc-name">${escapeHtml(k.nama_kategori)}</div>
      <div class="kc-meta">
        <span class="kc-poin ${poinCls}">${sign}${poin}</span>
        ${indCount ? `<span class="kc-ind"><span class="material-symbols-outlined">checklist</span>${indCount} indikator</span>` : ''}
      </div>
    </button>`;
  }
}

class App {
  constructor() {
    this.root = document.getElementById('app');
    this.token = sessionStorage.getItem(SSKeys.TOKEN);
    this._logoMarkup = () => {
      const img = LOGO_URL ? `<img src="${LOGO_URL}" alt="Logo" loading="lazy" onerror="this.remove()">` : '';
      return `<span class="material-symbols-outlined">monitoring</span>${img}`;
    };
  }

  init() {
    if (this.token) {
      this._renderShell();
      Api.verifyToken(this.token).then(ok => {
        if (!ok) { clearAllSession(); ClientCache.clear(); location.reload(); }
      });
    } else {
      this._renderLogin();
    }
  }

  _renderLogin() {
    this.root.innerHTML = `
      <div class="login-wrapper">
        <div class="logo-box">${this._logoMarkup()}</div>
        <p class="app-subtitle">Godegan e-Monitoring Behavior<br>Integrity Record Application</p>
        <input type="password" id="tokenInput" class="input-modern" placeholder="Masukkan Token Akses" autocomplete="off" autofocus>
        <button class="btn-modern" id="btnLogin">
          <span>Masuk Aplikasi</span>
          <span class="material-symbols-outlined" style="font-size:18px">arrow_forward</span>
        </button>
        <div class="login-desc-box">
          <h3><span class="material-symbols-outlined" style="font-size:18px">info</span> Tentang Aplikasi</h3>
          <p>GEMBIRA adalah sistem pencatatan perilaku siswa SD Negeri 1 Godegan. Membantu guru mendokumentasikan kejadian insidental berkaitan dengan sikap, karakter, dan perilaku siswa.</p>
        </div>
      </div>`;
    $('#btnLogin').onclick = () => this._handleLogin();
    $('#tokenInput').addEventListener('keypress', e => { if (e.key === 'Enter') this._handleLogin(); });
  }

  async _handleLogin() {
    const inp = $('#tokenInput');
    const token = inp.value.trim();
    if (!token) return showToast('Token tidak boleh kosong.', 'error');
    clearVerifyCache();
    const btn = $('#btnLogin');
    setLoading(btn, true, 'Memeriksa...');
    const ok = await Api.verifyToken(token, true);
    if (ok) {
      sessionStorage.setItem(SSKeys.TOKEN, token);
      ClientCache.clear();
      this.token = token;
      this._renderShell();
      showToast('Login berhasil. Selamat datang!', 'success');
    } else {
      showToast('Token tidak valid.', 'error');
      setLoading(btn, false);
      inp.value = ''; inp.focus();
    }
  }

  _renderShell() {
    this.root.innerHTML = `
      <header class="app-header">
        <h1><span class="header-logo">${this._logoMarkup()}</span> GEMBIRA</h1>
        <button class="btn-icon" id="btnLogout" title="Keluar" aria-label="Keluar">

        </button>
      </header>
      <main class="main-content">
        <div id="tabDashboard" class="tab-pane active"></div>
        <div id="tabCatat" class="tab-pane"></div>
        <div id="tabRiwayat" class="tab-pane"></div>
        <div id="tabLaporan" class="tab-pane"></div>
      </main>
      <nav class="bottom-nav">
        <button class="nav-item active" data-tab="dashboard" aria-label="Dashboard"><span class="material-symbols-outlined">dashboard</span><span>Dashboard</span></button>
        <button class="nav-item" data-tab="catat" aria-label="Catat"><span class="material-symbols-outlined">edit_square</span><span>Catat</span></button>
        <button class="nav-item" data-tab="riwayat" aria-label="Riwayat"><span class="material-symbols-outlined">history</span><span>Riwayat</span></button>
        <button class="nav-item" data-tab="laporan" aria-label="Laporan"><span class="material-symbols-outlined">print</span><span>Laporan</span></button>
      </nav>`;

    $$('.nav-item').forEach(btn => {
      btn.onclick = () => {
        const tab = btn.dataset.tab;
        $$('.nav-item').forEach(b => b.classList.toggle('active', b === btn));
        $$('.tab-pane').forEach(p => p.classList.toggle('active', p.id === `tab${tab[0].toUpperCase()+tab.slice(1)}`));
        if (tab === 'dashboard') this._dashboard?.refresh();
        if (tab === 'riwayat')   this._riwayat?.init();
        if (tab === 'laporan')   this._laporan?.init();
      };
    });

    $('#btnLogout').onclick = () => {
      clearAllSession();
      ClientCache.clear();
      location.reload();
    };

    this._dashboard = new DashboardTab($('#tabDashboard'));
    this._catat     = new CatatTab($('#tabCatat'));
    this._riwayat   = new RiwayatTab($('#tabRiwayat'));
    this._laporan   = new LaporanTab($('#tabLaporan'));

    this._dashboard.init();
    this._catat.init();
  }
}

class DashboardTab {
  constructor(el) { this.el = el; this.period = 'month'; this.chart = null; this._cache = {}; }
  init() {
    this.el.innerHTML = `
      <div class="greeting-section">
        <h2>👋 Selamat datang di Dashboard</h2>
        <p>Ringkasan aktivitas perilaku siswa SDN 1 Godegan</p>
      </div>
      <div class="filter-period">
        <span class="filter-label">📅 Periode:</span>
        <button class="filter-btn" data-period="today">Hari Ini</button>
        <button class="filter-btn" data-period="week">Minggu Ini</button>
        <button class="filter-btn active" data-period="month">Bulan Ini</button>
        <button class="filter-btn" data-period="all">Semua</button>
      </div>
      <div class="stats-grid">
        <div class="stat-card primary"><div class="stat-number" id="sTotalSiswa">-</div><div class="stat-label"><span class="material-symbols-outlined stat-icon">groups</span> Total Siswa</div></div>
        <div class="stat-card positif"><div class="stat-number" id="sPositif">-</div><div class="stat-label"><span class="material-symbols-outlined stat-icon">thumb_up</span> Positif</div></div>
        <div class="stat-card negatif"><div class="stat-number" id="sNegatif">-</div><div class="stat-label"><span class="material-symbols-outlined stat-icon">thumb_down</span> Negatif</div></div>
        <div class="stat-card primary"><div class="stat-number" id="sCatatan">-</div><div class="stat-label"><span class="material-symbols-outlined stat-icon">event_note</span> Total Catatan</div></div>
      </div>
      <div class="chart-container">
        <div class="chart-title"><span class="material-symbols-outlined" style="color:var(--primary)">bar_chart</span> Perilaku per Kelas</div>
        <div class="chart-wrapper"><canvas id="classChart"></canvas></div>
      </div>
      <div class="ranking-grid">
        <div class="ranking-card top">
          <div class="ranking-title"><span class="material-symbols-outlined">emoji_events</span> 🏆 5 Berprestasi</div>
          <div id="topStudents"><div class="empty-state"><span class="material-symbols-outlined spinner-dark" style="animation:spin 1s linear infinite">progress_activity</span></div></div>
        </div>
        <div class="ranking-card bottom">
          <div class="ranking-title"><span class="material-symbols-outlined">warning</span> ⚠️ 5 Perlu Pendampingan</div>
          <div id="bottomStudents"><div class="empty-state"><span class="material-symbols-outlined spinner-dark" style="animation:spin 1s linear infinite">progress_activity</span></div></div>
        </div>
      </div>
      <div class="activity-section">
        <div class="section-title"><span class="material-symbols-outlined" style="color:var(--primary)">schedule</span> Aktivitas Terbaru</div>
        <div id="recentActivities"><div class="empty-state"><span class="material-symbols-outlined spinner-dark" style="animation:spin 1s linear infinite">progress_activity</span></div></div>
      </div>
      <button class="btn-modern" id="btnKeRiwayat"><span class="material-symbols-outlined">arrow_forward</span> Lihat Semua Riwayat</button>`;

    $$('.filter-btn', this.el).forEach(b => b.onclick = () => {
      $$('.filter-btn', this.el).forEach(x => x.classList.toggle('active', x === b));
      this.period = b.dataset.period;
      this.refresh();
    });
    $('#btnKeRiwayat', this.el).onclick = () => $('[data-tab="riwayat"]').click();

    this.refresh();
  }
  async refresh() {
    if (this._cache[this.period]) this._render(this._cache[this.period]);
    try {
      const res = await Api.dashboard(this.period);
      const d = res?.data || res;
      if (d && typeof d === 'object' && !d.error) {
        this._cache[this.period] = d;
        this._render(d);
      }
    } catch { showToast('Gagal memuat dashboard.', 'error'); }
  }
  _render(d) {
    $('#sTotalSiswa', this.el).textContent = d.totalSiswa || 0;
    $('#sPositif', this.el).textContent = d.totalPositif || 0;
    $('#sNegatif', this.el).textContent = d.totalNegatif || 0;
    $('#sCatatan', this.el).textContent = d.totalCatatan || 0;
    this._chart(d.kelas || [], d.positifPerKelas || [], d.negatifPerKelas || []);
    this._ranking('topStudents', d.topStudents || []);
    this._ranking('bottomStudents', d.bottomStudents || []);
    this._activities(d.recentActivities || []);
  }
  _chart(kelas, positif, negatif) {
    if (typeof Chart === 'undefined') return;
    const ctx = $('#classChart', this.el)?.getContext('2d');
    if (!ctx) return;
    this.chart?.destroy();
    if (!kelas.length) {
      this.chart = new Chart(ctx, {
        type: 'bar',
        data: { labels: ['Tidak ada data'], datasets: [
          { label: 'Positif', data: [0], backgroundColor: '#10B981' },
          { label: 'Negatif', data: [0], backgroundColor: '#F43F5E' }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });
      return;
    }
    this.chart = new Chart(ctx, {
      type: 'bar',
      data: { labels: kelas, datasets: [
        { label: 'Positif', data: positif, backgroundColor: '#10B981', borderRadius: 4 },
        { label: 'Negatif', data: negatif, backgroundColor: '#F43F5E', borderRadius: 4 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'top', labels: { usePointStyle: true, padding: 16 } } },
        scales: { y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 }, grid: { color: 'rgba(0,0,0,.05)' } }, x: { grid: { display: false } } },
        animation: { duration: 600 }
      }
    });
  }
  _ranking(id, list) {
    const c = $('#' + id, this.el);
    if (!list.length) { c.innerHTML = `<div class="empty-state">Belum ada data</div>`; return; }
    c.innerHTML = list.map((s, i) => {
      const sign = s.poin >= 0 ? '+' : '';
      const cls = s.poin >= 0 ? 'positif' : 'negatif';
      return `<div class="ranking-item">
        <span class="rank-number">${i+1}</span>
        <span class="rank-name">${escapeHtml(s.nama)}</span>
        <span class="rank-class">Kelas ${escapeHtml(s.kelas)}</span>
        <span class="rank-poin ${cls}">${sign}${s.poin}</span>
      </div>`;
    }).join('');
  }
  _activities(list) {
    const c = $('#recentActivities', this.el);
    if (!list.length) { c.innerHTML = `<div class="empty-state">Belum ada aktivitas</div>`; return; }
    c.innerHTML = list.map(a => {
      const sign = a.poin >= 0 ? '+' : '';
      const icon = a.jenis === 'positif' ? 'thumb_up' : 'thumb_down';
      return `<div class="activity-item">
        <div class="activity-icon ${a.jenis}"><span class="material-symbols-outlined">${icon}</span></div>
        <div class="activity-content">
          <div class="activity-text"><strong>${escapeHtml(a.nama)}</strong> — ${escapeHtml(a.deskripsi)}</div>
          <div class="activity-time">${escapeHtml(a.waktu)} • Kelas ${escapeHtml(a.kelas)}</div>
        </div>
        <div class="activity-poin ${a.jenis}">${sign}${a.poin}</div>
      </div>`;
    }).join('');
  }
}

      $('#lblPos').className = 'radio-card';
      $('#lblNeg').className = 'radio-card';
      if (e.target.value === 'Positif') $('#lblPos').classList.add('selected-positif');
      else $('#lblNeg').classList.add('selected-negatif');
      // Reset kategori & indicator
      this.selectedKategori = null;
      this._updateKatTriggerUI();
      $('#indikatorWrap').style.display = 'none';
      $('#indikatorList').innerHTML = '';
      if ($('#beriPoin').checked) $('#poinInput').value = 0;
    });

    $('#beriPoin').onchange = e => {
      const pc = $('#poinWrap');
      const pi = $('#poinInput');
      if (!e.target.checked) { pi.value = 0; pc.style.display = 'none'; }
      else {
        pc.style.display = 'flex';
        if (this.selectedKategori) pi.value = this.selectedKategori.poin_default || 0;
      }
    };

    $('#btnSimpan').onclick = () => this._save();
  }

  _openKatSheet() {
    const jenis = $('input[name="jenis"]:checked', this.el)?.value || 'Positif';
    this.catSheet.open(this.kategori, jenis, this.selectedKategori?.id ?? null);
  }

  _applyKategori(kat) {
    this.selectedKategori = kat;
    this._updateKatTriggerUI();

    // Set poin default
    if ($('#beriPoin').checked) {
      $('#poinInput').value = kat.poin_default || 0;
    }

    // Render indikator
    const wrap = $('#indikatorWrap');
    const list = $('#indikatorList');
    if (kat.indikator && kat.indikator.length) {
      wrap.style.display = 'block';
      list.innerHTML = kat.indikator.map(ind =>
        `<label class="indikator-item"><input type="checkbox" class="indikator-check" value="${escapeHtml(ind)}"><span>${escapeHtml(ind)}</span></label>`
      ).join('');
    } else {
      wrap.style.display = 'none';
      list.innerHTML = '';
    }
  }

  _updateKatTriggerUI() {
    const trigger = $('#katTrigger');
    const ph = $('#katPlaceholder');
    const lbl = $('#katLabel');
    const meta = $('#katMeta');
    const poin = $('#katPoin');
    const kat = this.selectedKategori;

    if (!kat) {
      trigger.classList.remove('active');
      ph.style.display = '';
      lbl.style.display = 'none';
      meta.style.display = 'none';
      poin.style.display = 'none';
      return;
    }

    const p = Number(kat.poin_default) || 0;
    const sign = p > 0 ? '+' : '';
    const cls = p > 0 ? 'pos' : (p < 0 ? 'neg' : '');
    const isDis = Number(kat.id) >= 15;

    trigger.classList.add('active');
    ph.style.display = 'none';
    lbl.style.display = 'block';
    lbl.textContent = kat.nama_kategori;
    meta.style.display = 'flex';
    meta.innerHTML = `${isDis ? '📋 Kedisiplinan' : '🎯 Umum'}${kat.indikator?.length ? ' • ' + kat.indikator.length + ' indikator' : ''}`;
    poin.style.display = 'inline-flex';
    poin.className = `kat-poin ${cls}`;
    poin.textContent = `${sign}${p}`;
  }

  async _onKelas(kelas) {
    this.csSiswa.disable();
    if (!kelas) { this.csSiswa.setOptions([], '-- Pilih Kelas Dulu --'); return; }
    this.csSiswa.setOptions([], 'Memuat siswa...');
    try {
      const res = await Api.getSiswaKelas(kelas);
      const list = Array.isArray(res) ? res : (res.data || []);
      this.csSiswa.setOptions(list.map(s => ({ value: s.id, label: s.nama })), '-- Pilih Siswa --');
      this.csSiswa.enable();
    } catch {
      showToast('Gagal memuat siswa.', 'error');
      this.csSiswa.setOptions([], '-- Pilih Siswa --');
    }
  }

  async _save() {
    const id_siswa = this.csSiswa.getValue();
    if (!id_siswa) return showToast('Pilih siswa.', 'error');
    if (!this.selectedKategori) return showToast('Pilih kategori.', 'error');
    const deskripsi = $('#deskripsiInput').value.trim();
    if (!deskripsi) return showToast('Deskripsi harus diisi.', 'error');
    const pencatat = this.csPencatat ? this.csPencatat.getValue() : $('#pencatatInput').value.trim();
    if (!pencatat) return showToast('Nama pencatat harus diisi.', 'error');
    const indikator_terpilih = $$('.indikator-check:checked', this.el).map(c => c.value);
    const poin = $('#beriPoin').checked ? (parseInt($('#poinInput').value) || 0) : 0;

    const btn = $('#btnSimpan');
    setLoading(btn, true, 'Menyimpan...');
    try {
      const res = await Api.addPerilaku({
        id_siswa,
        tanggal: $('#tanggalInput').value,
        jenis: $('input[name="jenis"]:checked', this.el).value,
        id_kategori: parseInt(this.selectedKategori.id),
        deskripsi,
        indikator_terpilih,
        poin,
        pencatat
      });
      if (res?.error) throw new Error(res.error);
      showToast('Catatan berhasil disimpan.', 'success');

      // Reset form (pertahankan kelas & pencatat)
      this.csSiswa.setValue('', '-- Pilih Siswa --');
      this.selectedKategori = null;
      this._updateKatTriggerUI();
      $('#deskripsiInput').value = '';
      $('#poinInput').value = 0;
      $('#indikatorWrap').style.display = 'none';
      $('#indikatorList').innerHTML = '';
      $('#beriPoin').checked = true;
      $('#poinWrap').style.display = 'flex';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      showToast(err.message || 'Gagal menyimpan catatan.', 'error');
    } finally {
      setLoading(btn, false);
    }
  }
}

/* ==================== RIWAYAT ==================== */
class RiwayatTab {
  constructor(el) { this.el = el; this._loaded = false; this.siswaAktif = null; }
  init() {
    if (this._loaded) return;
    this._loaded = true;
    this.el.innerHTML = `
      <h2 class="section-title">📋 Riwayat Siswa</h2>
      <div class="search-bar">
        <input type="text" id="cariInput" class="input-modern" placeholder="Ketik Nama Siswa..." autocomplete="off">
        <button class="btn-modern" id="btnCari" style="width:auto;padding:0 1rem" aria-label="Cari"><span class="material-symbols-outlined">search</span></button>
      </div>
      <div id="profilWrap"></div>
      <div id="filterWrap" class="filter-box" style="display:none">
        <div id="csFilterWrap"></div>
        <button id="btnFilter" class="btn-modern"><span class="material-symbols-outlined">filter_list</span> Filter</button>
        <input type="date" id="tglMulai" title="Dari">
        <input type="date" id="tglSampai" title="Sampai">
      </div>
      <div id="riwayatWrap">
        <div class="empty-state"><span class="material-symbols-outlined">person_search</span><p>Masukkan nama siswa.</p></div>
      </div>`;

    this.csFilter = new CustomSelect('csFilterWrap', { placeholder: 'Semua Jenis' });
    this.csFilter.setOptions([
      { value: 'Positif', label: 'Positif' },
      { value: 'Negatif', label: 'Negatif' }
    ], 'Semua Jenis');

    const doSearch = debounce(() => this._cari(), 350);
    $('#cariInput').addEventListener('input', doSearch);
    $('#cariInput').addEventListener('keypress', e => { if (e.key === 'Enter') this._cari(); });
    $('#btnCari').onclick = () => this._cari();
    $('#btnFilter').onclick = () => this.siswaAktif && this._load(this.siswaAktif.id);
  }

  async _cari() {
    const q = $('#cariInput').value.trim();
    if (!q) return;
    const c = $('#riwayatWrap');
    c.innerHTML = `<div class="empty-state"><span class="material-symbols-outlined spinner-dark" style="animation:spin 1s linear infinite">progress_activity</span><p>Mencari...</p></div>`;
    $('#profilWrap').innerHTML = '';
    $('#filterWrap').style.display = 'none';
    try {
      const res = await Api.cariSiswa(q);
      const list = Array.isArray(res) ? res : (res.data || []);
      if (!list.length) {
        showToast('Siswa tidak ditemukan.', 'error');
        c.innerHTML = `<div class="empty-state"><span class="material-symbols-outlined">sentiment_dissatisfied</span><p>Tidak ditemukan.</p></div>`;
        return;
      }
      if (list.length === 1) this._showProfil(list[0]);
      else this._showList(list);
    } catch {
      showToast('Gagal mencari.', 'error');
    }
  }

  _showList(list) {
    const c = $('#riwayatWrap');
    $('#profilWrap').innerHTML = '';
    $('#filterWrap').style.display = 'none';
    c.innerHTML = `
      <div style="margin-bottom:1rem;padding:.8rem;background:var(--primary-light);border-radius:var(--radius-sm)">
        <strong>${list.length} siswa ditemukan.</strong> Klik untuk melihat riwayat.
      </div>
      <div style="display:flex;flex-direction:column;gap:.6rem">
        ${list.map(s => {
          const ini = (s.nama || '?').trim().charAt(0).toUpperCase();
          return `<div class="history-card" style="cursor:pointer" data-id="${escapeHtml(s.id)}" data-nama="${escapeHtml(s.nama)}" data-kelas="${escapeHtml(s.kelas)}">
            <div style="display:flex;align-items:center;gap:.8rem">
              <div class="avatar-circle" style="width:40px;height:40px;font-size:.9rem">${ini}</div>
              <div>
                <div style="font-weight:700">${escapeHtml(s.nama)}</div>
                <div style="font-size:.85rem;color:var(--text-muted)">Kelas ${escapeHtml(s.kelas)}</div>
              </div>
              <span style="margin-left:auto;color:var(--primary)" class="material-symbols-outlined">chevron_right</span>
            </div>
          </div>`;
        }).join('')}
      </div>`;
    $$('.history-card', c).forEach(card => {
      card.onclick = () => this._showProfil({
        id: card.dataset.id,
        nama: card.dataset.nama,
        kelas: card.dataset.kelas
      });
    });
  }

  _showProfil(s) {
    this.siswaAktif = s;
    const ini = (s.nama || '?').trim().charAt(0).toUpperCase();
    $('#profilWrap').innerHTML = `
      <div class="profil-card">
        <div class="profil-left">
          <div class="avatar-circle">${ini}</div>
          <div class="profil-info">
            <div class="nama">${escapeHtml(s.nama)}</div>
            <div class="detail">Kelas ${escapeHtml(s.kelas)}</div>
          </div>
        </div>
        <div class="poin-total">
          <div class="angka" id="totalPoin">…</div>
          <div class="label">TOTAL POIN</div>
        </div>
      </div>`;
    $('#filterWrap').style.display = 'grid';
    this._load(s.id);
  }

  async _load(id) {
    const c = $('#riwayatWrap');
    c.innerHTML = `<div class="empty-state"><span class="material-symbols-outlined spinner-dark" style="animation:spin 1s linear infinite">progress_activity</span><p>Memuat riwayat...</p></div>`;
    const filter = {
      jenis: this.csFilter.getValue(),
      tgl_mulai: $('#tglMulai').value,
      tgl_sampai: $('#tglSampai').value
    };
    try {
      const res = await Api.riwayat(id, filter);
      const list = Array.isArray(res) ? res : (res.data || []);
      let total = 0;
      if (!list.length) {
        c.innerHTML = `<div class="empty-state"><span class="material-symbols-outlined">inbox</span><p>Belum ada catatan.</p></div>`;
        $('#totalPoin').textContent = '0';
        return;
      }
      c.innerHTML = list.map(it => {
        total += it.poin || 0;
        const isPos = it.poin > 0;
        const isNeg = it.poin < 0;
        const badge = isPos ? 'positif' : (isNeg ? 'negatif' : 'netral');
        const sign = isPos ? '+' : '';
        const ind = it.indikator_terpilih?.length
          ? `<div class="hc-indikator"><strong>Indikator:</strong><ul>${it.indikator_terpilih.map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul></div>`
          : '';
        return `<div class="history-card">
          <div class="hc-header">
            <div class="hc-date"><span class="material-symbols-outlined">calendar_today</span> ${fmtDate(it.tanggal)}</div>
            <div class="badge ${badge}">${sign}${it.poin} Poin</div>
          </div>
          <div class="hc-kat">${escapeHtml(it.nama_kategori || '-')}</div>
          <div class="hc-desc">"${escapeHtml(it.deskripsi)}"</div>
          ${ind}
          <div class="hc-footer">
            <span>Oleh: <strong>${escapeHtml(it.pencatat)}</strong></span>
            <span style="color:${isPos ? 'var(--positive)' : (isNeg ? 'var(--negative)' : 'var(--text-muted)')};font-weight:600">${escapeHtml(it.jenis)}</span>
          </div>
        </div>`;
      }).join('');
      $('#totalPoin').textContent = total;
    } catch {
      showToast('Gagal memuat riwayat.', 'error');
    }
  }
}

/* ==================== LAPORAN ==================== */
class LaporanTab {
  constructor(el) { this.el = el; this._loaded = false; this.kelas = []; }
  async init() {
    if (this._loaded) return;
    this.el.innerHTML = `<div class="empty-state"><span class="material-symbols-outlined spinner-dark" style="animation:spin 1s linear infinite">progress_activity</span><p>Menyiapkan...</p></div>`;
    try {
      const res = await Api.getKelas();
      this.kelas = Array.isArray(res) ? res : (res.data || []);
    } catch { this.kelas = []; }
    this._render();
    this._loaded = true;
  }
  _render() {
    this.el.innerHTML = `
      <h2 class="section-title no-print">🖨️ Cetak Laporan</h2>
      <div class="laporan-control no-print">
        <div class="full">
          <label>Pilih Kelas</label>
          <div id="lapKelasWrap"></div>
        </div>
        <div>
          <label>Dari Tanggal</label>
          <input type="date" id="lapMulai" value="${firstOfMonthYMD()}">
        </div>
        <div>
          <label>Sampai Tanggal</label>
          <input type="date" id="lapSampai" value="${todayYMD()}">
        </div>
        <div class="full">
          <label class="laporan-check">
            <input type="checkbox" id="lapNonaktif">
            <span>Tampilkan siswa non-aktif (mis. siswa lulus)</span>
          </label>
        </div>
        <button class="btn-modern full" id="btnLihat"><span class="material-symbols-outlined">visibility</span> Tampilkan Laporan</button>
        <button class="btn-modern full" id="btnPrint" style="background:var(--positive)"><span class="material-symbols-outlined">print</span> Cetak / Simpan PDF</button>
      </div>
      <div id="lapOutput"></div>`;
    this.csKelas = new CustomSelect('lapKelasWrap', { placeholder: 'Semua Kelas' });
    this.csKelas.setOptions(this.kelas.map(k => ({ value: k, label: `Kelas ${k}` })), 'Semua Kelas');
    $('#btnLihat').onclick = () => this._load();
    $('#btnPrint').onclick = () => window.print();
  }
  async _load() {
    const btn = $('#btnLihat');
    const out = $('#lapOutput');
    setLoading(btn, true, 'Memuat...');
    out.innerHTML = `<div class="empty-state"><span class="material-symbols-outlined spinner-dark" style="animation:spin 1s linear infinite">progress_activity</span><p>Menyiapkan laporan...</p></div>`;
    try {
      const res = await Api.laporan(
        this.csKelas.getValue(),
        $('#lapMulai').value,
        $('#lapSampai').value,
        $('#lapNonaktif').checked
      );
      if (res?.error) throw new Error(res.error);
      this._renderReport(res);
    } catch (err) {
      showToast(err.message || 'Gagal memuat laporan.', 'error');
      out.innerHTML = `<div class="empty-state"><p>Gagal memuat laporan.</p></div>`;
    } finally {
      setLoading(btn, false);
    }
  }
  _renderReport(res) {
    const out = $('#lapOutput');
    const kelas     = res.kelas || 'Semua';
    const tglMulai  = res.tglMulai || '-';
    const tglSampai = res.tglSampai || '-';
    const dicetak   = res.dicetak || '';
    const data      = res.data || [];
    const rk        = res.ringkasan || {};

    let totalPos = rk.totalPositif ?? 0;
    let totalNeg = rk.totalNegatif ?? 0;
    let totalPoin = rk.totalPoin ?? 0;

    if (rk.totalPositif === undefined) {
      totalPos = totalNeg = totalPoin = 0;
      data.forEach(s => {
        totalPos += s.positif || 0;
        totalNeg += s.negatif || 0;
        totalPoin += s.totalPoin || 0;
      });
    }

    const fmtLong = s => (s && s !== '-') ? fmtDate(s, { day:'numeric', month:'long', year:'numeric' }) : '-';
    const today = new Date().toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });

    out.innerHTML = `
      <div class="print-header">
        <div class="kop">
          <img src="${LOGO_URL}" alt="Logo" onerror="this.style.display='none'">
          <div class="teks">
            <h2>SD NEGERI 1 GODEGAN</h2>
            <h3>LAPORAN PERILAKU SISWA</h3>
            <p>Kelas: ${escapeHtml(kelas)} • Periode: ${fmtLong(tglMulai)} s.d. ${fmtLong(tglSampai)}${res.includeNonAktif ? ' • (termasuk siswa non-aktif)' : ''}</p>
          </div>
        </div>
      </div>
      <div class="laporan-summary no-print">
        <div><span class="val" style="color:var(--primary)">${rk.totalSiswa ?? data.length}</span><span class="lbl">Siswa</span></div>
        <div><span class="val" style="color:var(--positive)">${totalPos}</span><span class="lbl">Positif</span></div>
        <div><span class="val" style="color:var(--negative)">${totalNeg}</span><span class="lbl">Negatif</span></div>
        <div><span class="val" style="color:${totalPoin >= 0 ? 'var(--positive)' : 'var(--negative)'}">${totalPoin >= 0 ? '+' : ''}${totalPoin}</span><span class="lbl">Total Poin</span></div>
      </div>
      <div class="laporan-summary no-print" style="background:transparent; border:none; padding:0; margin-bottom:.8rem; font-size:.75rem; color:var(--text-muted); grid-template-columns:1fr">
        <span>Dicetak: ${escapeHtml(dicetak)}</span>
      </div>
      <div style="overflow-x:auto">
        <table class="laporan-table">
          <thead>
            <tr>
              <th style="width:40px">No</th>
              <th>Nama Siswa</th>
              <th style="width:60px;text-align:center">Kelas</th>
              <th style="width:70px;text-align:center">Positif</th>
              <th style="width:70px;text-align:center">Negatif</th>
              <th style="width:80px;text-align:center">Total</th>
            </tr>
          </thead>
          <tbody>
            ${data.length === 0
              ? `<tr><td colspan="6" style="text-align:center;padding:1.5rem;color:var(--text-muted)">Tidak ada data pada periode ini.</td></tr>`
              : data.map((s, i) => `<tr>
                  <td>${i+1}</td>
                  <td>${escapeHtml(s.nama)}${s.status && s.status !== 'aktif' ? ` <small style="color:var(--text-muted)">(${escapeHtml(s.status)})</small>` : ''}</td>
                  <td style="text-align:center">${escapeHtml(s.kelas)}</td>
                  <td class="pos" style="text-align:center">${s.positif || 0}</td>
                  <td class="neg" style="text-align:center">${s.negatif || 0}</td>
                  <td class="${(s.totalPoin || 0) >= 0 ? 'pos' : 'neg'}" style="text-align:center">${(s.totalPoin || 0) >= 0 ? '+' : ''}${s.totalPoin || 0}</td>
                </tr>`).join('')
            }
            ${data.length > 0 ? `
              <tr class="laporan-total">
                <td colspan="3" style="text-align:right">TOTAL</td>
                <td class="pos" style="text-align:center">${totalPos}</td>
                <td class="neg" style="text-align:center">${totalNeg}</td>
                <td class="${totalPoin >= 0 ? 'pos' : 'neg'}" style="text-align:center">${totalPoin >= 0 ? '+' : ''}${totalPoin}</td>
              </tr>` : ''}
          </tbody>
        </table>
      </div>
      <div class="ttd-grid">
        <div class="ttd-box">
          <div>Mengetahui,<br>Kepala Sekolah</div>
          <div class="line">(...................................)</div>
        </div>
        <div class="ttd-box">
          <div>Godegan, ${today}<br>Guru BK / Pencatat</div>
          <div class="line">(...................................)</div>
        </div>
      </div>`;
  }
}

/* ==================== BOOT ==================== */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => new App().init(), { once: true });
} else {
  new App().init();
}

})();
</script>
