        <button class="nav-item active" data-tab="dashboard" aria-label="Dashboard"><span class="material-symbols-outlined">dashboard</span><span>Dashboard</span></button>
        <button class="nav-item" data-tab="catat" aria-label="Catat"><span class="material-symbols-outlined">edit_square</span><span>Catat</span></button>
        <button class="nav-item" data-tab="riwayat" aria-label="Riwayat"><span class="material-symbols-outlined">history</span><span>Riwayat</span></button>
        <button class="nav-item" data-tab="laporan" aria-label="Laporan"><span class="material-symbols-outlined">print</span><span>Laporan</span></button>
      </nav>`;
    $$('.nav-item').forEach(btn => {
      btn.onclick = () => {
        const tab = btn.dataset.tab;
        $$('.nav-item').forEach(b => b.classList.toggle('active', b === btn));
        $$('.tab-pane').forEach(p => p.classList.toggle('active', p.id === `tab${tab[0].toUpperCase()+tab.slice(1)}`));
        if (tab === 'dashboard') this._dashboard?.refresh();
        if (tab === 'riwayat') this._riwayat?.init();
        if (tab === 'laporan') this._laporan?.init();
      };
    });
    $('#btnLogout').onclick = () => { clearAllSession(); location.reload(); };
    this._dashboard = new DashboardTab($('#tabDashboard'));
    this._catat = new CatatTab($('#tabCatat'), this.guru);
    this._riwayat = new RiwayatTab($('#tabRiwayat'));
    this._laporan = new LaporanTab($('#tabLaporan'));
    this._dashboard.init();
    this._catat.init();
  }
}

/* ==================== DASHBOARD ==================== */
class DashboardTab {
  constructor(el) { this.el = el; this.period = 'month'; this.chart = null; this._cache = {}; }
  init() {
    this.el.innerHTML = `
      <div class="greeting-section"><h2>👋 Selamat datang di Dashboard</h2><p>Ringkasan aktivitas perilaku siswa SDN 1 Godegan</p></div>
      <div class="filter-period">
        <span class="filter-label">📅 Periode:</span>
        <button class="filter-btn" data-period="today">Hari Ini</button>
        <button class="filter-btn" data-period="week">Minggu Ini</button>
        <button class="filter-btn active" data-period="month">Bulan Ini</button>
        <button class="filter-btn" data-period="all">Semua</button>
      </div>
      <div class="stats-grid">
        <div class="stat-card primary"><div class="stat-number" id="sTotalSiswa">-</div><div class="stat-label"><span class="material-symbols-outlined stat-icon">groups</span> Total Siswa</div></div>
        <div class="stat-card positif"><div class="stat-number" id="sPositif">-</div><div class="stat-label"><span class="material-symbols-outlined stat-icon">thumb_up</span> Positif</div></div>
        <div class="stat-card negatif"><div class="stat-number" id="sNegatif">-</div><div class="stat-label"><span class="material-symbols-outlined stat-icon">thumb_down</span> Negatif</div></div>
        <div class="stat-card primary"><div class="stat-number" id="sCatatan">-</div><div class="stat-label"><span class="material-symbols-outlined stat-icon">event_note</span> Total Catatan</div></div>
      </div>
      <div class="chart-container">
        <div class="chart-title"><span class="material-symbols-outlined" style="color:var(--primary)">bar_chart</span> Perilaku per Kelas</div>
        <div class="chart-wrapper"><canvas id="classChart"></canvas></div>
      </div>
      <div class="ranking-grid">
        <div class="ranking-card top"><div class="ranking-title"><span class="material-symbols-outlined">emoji_events</span> 🏆 5 Berprestasi</div><div id="topStudents"><div class="empty-state"><span class="material-symbols-outlined spinner-dark" style="animation:spin 1s linear infinite">progress_activity</span></div></div></div>
        <div class="ranking-card bottom"><div class="ranking-title"><span class="material-symbols-outlined">warning</span> ⚠️ 5 Perlu Pendampingan</div><div id="bottomStudents"><div class="empty-state"><span class="material-symbols-outlined spinner-dark" style="animation:spin 1s linear infinite">progress_activity</span></div></div></div>
      </div>
      <div class="activity-section">
        <div class="section-title"><span class="material-symbols-outlined" style="color:var(--primary)">schedule</span> Aktivitas Terbaru</div>
        <div id="recentActivities"><div class="empty-state"><span class="material-symbols-outlined spinner-dark" style="animation:spin 1s linear infinite">progress_activity</span></div></div>
      </div>
      <button class="btn-modern" id="btnKeRiwayat"><span class="material-symbols-outlined">arrow_forward</span> Lihat Semua Riwayat</button>`;
    $$('.filter-btn', this.el).forEach(b => b.onclick = () => {
      $$('.filter-btn', this.el).forEach(x => x.classList.toggle('active', x === b));
      this.period = b.dataset.period;
      this.refresh();
    });
    $('#btnKeRiwayat', this.el).onclick = () => $('[data-tab="riwayat"]').click();
    this.refresh();
  }
  async refresh() {
    if (this._cache[this.period]) this._render(this._cache[this.period]);
    try {
      const res = await Api.dashboard(this.period);
      const d = res?.data || res;
      if (d && typeof d === 'object' && !d.error) { this._cache[this.period] = d; this._render(d); }
      else { this._renderError(); }
    } catch (err) { if (!this._cache[this.period]) this._renderError(); }
  }
  _renderError() {
    ['sTotalSiswa','sPositif','sNegatif','sCatatan'].forEach(id => { const n = $('#' + id, this.el); if (n) n.textContent = '?'; });
    const c = $('#recentActivities', this.el);
    if (c) {
      c.innerHTML = `<div class="empty-state" style="padding:2rem 1rem"><span class="material-symbols-outlined" style="font-size:44px;color:var(--negative);opacity:.6">cloud_off</span><p style="margin:.4rem 0">Gagal memuat data.</p><button class="btn-modern" id="btnRetryDash" style="width:auto;padding:.5rem 1.2rem;font-size:.85rem"><span class="material-symbols-outlined" style="font-size:18px">refresh</span> Coba Lagi</button></div>`;
      const btn = $('#btnRetryDash', this.el);
      if (btn) btn.onclick = () => this.refresh();
    }
  }
  _render(d) {
    $('#sTotalSiswa', this.el).textContent = d.totalSiswa || 0;
    $('#sPositif', this.el).textContent = d.totalPositif || 0;
    $('#sNegatif', this.el).textContent = d.totalNegatif || 0;
    $('#sCatatan', this.el).textContent = d.totalCatatan || 0;
    this._chart(d.kelas || [], d.positifPerKelas || [], d.negatifPerKelas || []);
    this._ranking('topStudents', d.topStudents || []);
    this._ranking('bottomStudents', d.bottomStudents || []);
    this._activities(d.recentActivities || []);
  }
  _chart(kelas, positif, negatif) {
    if (typeof Chart === 'undefined') return;
    const ctx = $('#classChart', this.el)?.getContext('2d');
    if (!ctx) return;
    this.chart?.destroy();
    const allZero = positif.every(v => !v) && negatif.every(v => !v);
    if (!kelas.length || allZero) {
      this.chart = new Chart(ctx, {
        type: 'bar',
        data: { labels: kelas.length ? kelas : ['Tidak ada data'], datasets: [
          { label: 'Positif', data: kelas.map(() => 0), backgroundColor: '#10B981', borderRadius: 4 },
          { label: 'Negatif', data: kelas.map(() => 0), backgroundColor: '#F43F5E', borderRadius: 4 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top', labels: { usePointStyle: true, padding: 12, font: { size: 11 } } } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0, font: { size: 10 } } }, x: { grid: { display: false }, ticks: { font: { size: 10 } } } } }
      });
      return;
    }
    this.chart = new Chart(ctx, {
      type: 'bar',
      data: { labels: kelas, datasets: [
        { label: 'Positif', data: positif, backgroundColor: '#10B981', borderRadius: 4 },
        { label: 'Negatif', data: negatif, backgroundColor: '#F43F5E', borderRadius: 4 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top', labels: { usePointStyle: true, padding: 12, font: { size: 11 } } } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0, font: { size: 10 } }, grid: { color: 'rgba(0,0,0,.05)' } }, x: { grid: { display: false }, ticks: { font: { size: 10 } } } }, animation: { duration: 600 } }
    });
  }
  _ranking(id, list) {
    const c = $('#' + id, this.el);
    if (!list.length) { c.innerHTML = `<div class="empty-state">Belum ada data</div>`; return; }
    c.innerHTML = list.map((s, i) => {
      const sign = s.poin >= 0 ? '+' : '';
      const cls = s.poin >= 0 ? 'positif' : 'negatif';
      return `<div class="ranking-item"><span class="rank-number">${i+1}</span><span class="rank-name">${escapeHtml(s.nama)}</span><span class="rank-class">Kelas ${escapeHtml(s.kelas)}</span><span class="rank-poin ${cls}">${sign}${s.poin}</span></div>`;
    }).join('');
  }
  _activities(list) {
    const c = $('#recentActivities', this.el);
    if (!list.length) { c.innerHTML = `<div class="empty-state">Belum ada aktivitas</div>`; return; }
    c.innerHTML = list.map(a => {
      const jenis = a.jenis === 'positif' ? 'positif' : 'negatif';
      const icon = jenis === 'positif' ? 'thumb_up' : 'thumb_down';
      const sign = a.poin > 0 ? '+' : '';
      return `<div class="activity-item"><div class="activity-icon ${jenis}"><span class="material-symbols-outlined">${icon}</span></div><div class="activity-content"><div class="activity-text"><strong>${escapeHtml(a.nama)}</strong> — ${escapeHtml(a.deskripsi)}</div><div class="activity-time">${escapeHtml(a.waktu)} • Kelas ${escapeHtml(a.kelas)}</div></div><div class="activity-poin ${jenis}">${sign}${a.poin}</div></div>`;
    }).join('');
  }
}

/* ==================== CATAT (ALUR BARU) ==================== */
class CatatTab {
  constructor(el, guru) {
    this.el = el;
    this.guru = guru;
    this.kategori = [];
    this.kelas = [];
    this.selectedKategori = null;
    this.pilihanTahap1 = null;
    this.pilihanTahap2 = null;
    this.poinFinal = 0;
  }

  async init() {
    this.el.innerHTML = `<div class="empty-state"><span class="material-symbols-outlined spinner-dark" style="animation:spin 1s linear infinite">progress_activity</span><p>Memuat formulir...</p></div>`;
    await this._loadFormData();
    this._render();
    const guruKelas = this.guru?.kelas;
    if (guruKelas && this.kelas.map(String).includes(String(guruKelas))) {
      setTimeout(() => { this.csKelas.setValue(String(guruKelas), `Kelas ${guruKelas}`); this._onKelas(String(guruKelas)); }, 100);
    }
  }

  async _loadFormData() {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const r = await Api.bootstrap();
        if (r && !r.error) {
          const kls = normalizeList(r.kelas, 'kelas');
          const kat = normalizeList(r.kategori, 'kategori');
          if (kls.length) { this.kelas = kls; saveToLocal(LSKeys.KELAS, kls); }
          if (kat.length) { this.kategori = kat; saveToLocal(LSKeys.KATEGORI, kat); }
          if (this.kelas.length) return;
        }
      } catch (_) {}
      if (attempt === 0) await sleep(700);
    }
    try {
      const [kat, kls] = await Promise.all([Api.getKategori().catch(() => null), Api.getKelas().catch(() => null)]);
      const klsList = normalizeList(kls, 'kelas'); const katList = normalizeList(kat, 'kategori');
      if (klsList.length) { this.kelas = klsList; saveToLocal(LSKeys.KELAS, klsList); }
      if (katList.length) { this.kategori = katList; saveToLocal(LSKeys.KATEGORI, katList); }
    } catch (_) {}
    if (!this.kelas.length) { const c = loadFromLocal(LSKeys.KELAS); if (c.length) this.kelas = c; }
    if (!this.kategori.length) { const c = loadFromLocal(LSKeys.KATEGORI); if (c.length) this.kategori = c; }
    if (!this.kelas.length) setTimeout(() => showToast('Daftar kelas belum tersedia. Coba muat ulang.', 'error'), 400);
  }

  async _retryLoadFormData() {
    const btn = $('#btnRetryKelas');
    if (btn) setLoading(btn, true, 'Memuat...');
    ClientCache.clear();
    await this._loadFormData();
    if (this.csKelas) this.csKelas.setOptions(this.kelas.map(k => ({ value: k, label: `Kelas ${k}` })), this.kelas.length ? '-- Pilih Kelas --' : '-- Kelas belum tersedia --');
    if (btn) setLoading(btn, false);
    if (this.kelas.length) { showToast(`Berhasil memuat ${this.kelas.length} kelas.`, 'success'); const el = $('#kelasRetryWrap'); if (el) el.style.display = 'none'; }
  }

  _render() {
    const g = this.guru || {};
    let jabatanLine = (g.jabatan || '').trim();
    if (g.kelas) {
      const jl = jabatanLine.toLowerCase();
      if (jl.includes('kelas') || jl.includes('wali')) jabatanLine = `${jabatanLine} ${g.kelas}`.trim();
      else jabatanLine = `${jabatanLine} Kelas ${g.kelas}`.trim();
    }
    this.el.innerHTML = `
      <h2 class="section-title">📝 Formulir Pencatatan</h2>
      <div class="form-group">
        <label>Guru / Pencatat</label>
        <div class="pencatat-box"><span class="material-symbols-outlined">badge</span><div class="pb-info"><div class="pb-nama">${escapeHtml(g.nama || '')}</div><div class="pb-jabatan">${escapeHtml(jabatanLine || g.id || '')}</div></div></div>
      </div>
      <div class="form-group">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem">
          <label style="margin:0">Kelas</label>
          <div id="kelasRetryWrap" style="display:${this.kelas.length ? 'none' : 'flex'}">
            <button type="button" class="retry-mini" id="btnRetryKelas"><span class="material-symbols-outlined">refresh</span> Muat Ulang</button>
          </div>
        </div>
        <div id="csKelasWrap"></div>
      </div>
      <div class="form-group"><label>Siswa</label><div id="csSiswaWrap"></div></div>
      <div class="form-group">
        <label>Jenis Perilaku</label>
        <div class="radio-card-group">
          <label class="radio-card selected-positif" id="lblPos"><input type="radio" name="jenis" value="Positif" checked><span class="material-symbols-outlined">thumb_up</span> Positif</label>
          <label class="radio-card" id="lblNeg"><input type="radio" name="jenis" value="Negatif"><span class="material-symbols-outlined">thumb_down</span> Negatif</label>
        </div>
      </div>
      <div class="form-group">
        <label>Kategori</label>
        <button type="button" class="kat-trigger" id="katTrigger">
          <span class="kat-icon material-symbols-outlined">category</span>
          <span class="kat-text">
            <span class="kat-placeholder" id="katPlaceholder">-- Pilih Kategori --</span>
            <span class="kat-label" id="katLabel" style="display:none"></span>
            <span class="kat-meta" id="katMeta" style="display:none"></span>
          </span>
          <span class="kat-poin" id="katPoin">0</span>
          <span class="material-symbols-outlined cs-chevron">expand_more</span>
        </button>
      </div>
      <div class="form-group" id="tahap1Wrap" style="display:none">
        <label id="tahap1Label">Tingkat</label>
        <div class="tingkat-list" id="tahap1List"></div>
      </div>
      <div class="form-group" id="tahap2Wrap" style="display:none">
        <label id="tahap2Label">Frekuensi</label>
        <div class="tingkat-list" id="tahap2List"></div>
      </div>
      <div class="form-group" id="poinWrap" style="display:none">
        <label>Poin yang Diberikan</label>
        <input type="number" id="poinInput" value="0" step="1" readonly style="font-weight:800;color:var(--primary);background:var(--primary-light);font-size:1.15rem;text-align:center">
      </div>
      <div class="form-group">
        <label>Deskripsi / Kronologi</label>
        <textarea id="deskripsiInput" placeholder="Jelaskan apa yang terjadi..." rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Tanggal Kejadian</label>
        <input type="date" id="tanggalInput" value="${todayYMD()}" max="${todayYMD()}">
      </div>
      <button class="btn-modern" id="btnSimpan" style="margin-top:.8rem"><span class="material-symbols-outlined">save</span> Simpan Catatan</button>`;

    this.csKelas = new CustomSelect('csKelasWrap', { placeholder: this.kelas.length ? '-- Pilih Kelas --' : '-- Kelas belum tersedia --', onChange: v => this._onKelas(v) });
    this.csKelas.setOptions(this.kelas.map(k => ({ value: k, label: `Kelas ${k}` })), this.kelas.length ? '-- Pilih Kelas --' : '-- Kelas belum tersedia --');
    const btnRetry = $('#btnRetryKelas'); if (btnRetry) btnRetry.onclick = () => this._retryLoadFormData();

    this.csSiswa = new CustomSelect('csSiswaWrap', { placeholder: '-- Pilih Kelas Dulu --', searchable: true });
    this.csSiswa.disable();

    if (!this.catSheet) this.catSheet = new CategorySheet({ onSelect: (kat) => this._applyKategori(kat) });

    $('#katTrigger').onclick = () => this._openKatSheet();

    $$('input[name="jenis"]', this.el).forEach(r => r.onchange = e => {
      $('#lblPos').className = 'radio-card';
      $('#lblNeg').className = 'radio-card';
      if (e.target.value === 'Positif') $('#lblPos').classList.add('selected-positif');
      else $('#lblNeg').classList.add('selected-negatif');
      this._resetKategoriState();
    });

    $('#btnSimpan').onclick = () => this._save();
  }

  _resetKategoriState() {
    this.selectedKategori = null;
    this.pilihanTahap1 = null;
    this.pilihanTahap2 = null;
    this.poinFinal = 0;
    this._updateKatTriggerUI();
    const w1 = $('#tahap1Wrap'); const w2 = $('#tahap2Wrap'); const wp = $('#poinWrap');
    if (w1) w1.style.display = 'none';
    if (w2) w2.style.display = 'none';
    if (wp) wp.style.display = 'none';
  }

  _openKatSheet() {
    const jenis = $('input[name="jenis"]:checked', this.el)?.value || 'Positif';
    this.catSheet.open(this.kategori, jenis, this.selectedKategori?.id ?? null);
  }

  _applyKategori(kat) {
    this.selectedKategori = kat;
    this.pilihanTahap1 = null;
    this.pilihanTahap2 = null;
    this.poinFinal = 0;
    this._updateKatTriggerUI();
    const deskripsiEl = $('#deskripsiInput');
    if (deskripsiEl) deskripsiEl.value = '';

    const ind = kat.indikator || { tipe: null, items: [], tahap2: null };
    const tahap1Wrap = $('#tahap1Wrap'); const tahap2Wrap = $('#tahap2Wrap'); const poinWrap = $('#poinWrap');

    // Kategori tanpa tingkat → langsung set poin default
    if (!ind.tipe || !ind.items || !ind.items.length) {
      this.poinFinal = Number(kat.poin_default) || 0;
      tahap1Wrap.style.display = 'none';
      tahap2Wrap.style.display = 'none';
      poinWrap.style.display = 'block';
      $('#poinInput').value = this.poinFinal;
      return;
    }

    // Render tahap 1
    $('#tahap1Label').textContent = ind.tipe;
    this._renderTingkat('tahap1List', ind.items, (item) => {
      this.pilihanTahap1 = item.label;
      this._onTahap1Selected(item, ind);
    });
    tahap1Wrap.style.display = 'block';

    // Reset tahap 2 & poin
    tahap2Wrap.style.display = 'none';
    poinWrap.style.display = 'none';
  }

  _renderTingkat(listId, items, onSelect) {
    const listEl = $('#' + listId);
    if (!listEl) return;
    listEl.innerHTML = items.map((item, i) => {
      const poin = item.poin;
      let poinHtml = '';
      if (poin !== null && poin !== undefined) {
        const cls = poin > 0 ? 'pos' : (poin < 0 ? 'neg' : 'netral');
        poinHtml = `<span class="ti-poin ${cls}">${fmtPoin(poin)}</span>`;
      }
      return `<div class="tingkat-item" data-idx="${i}" role="radio" tabindex="0">
        <span class="ti-radio"></span>
        <span class="ti-label">${escapeHtml(item.label)}</span>
        ${poinHtml}
      </div>`;
    }).join('');
    $$('.tingkat-item', listEl).forEach(el => {
      const handler = () => {
        $$('.tingkat-item', listEl).forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
        const idx = parseInt(el.dataset.idx, 10);
        onSelect(items[idx]);
      };
      el.onclick = handler;
      el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handler(); } };
    });
  }

  _onTahap1Selected(item, ind) {
    const tahap2Wrap = $('#tahap2Wrap'); const poinWrap = $('#poinWrap');

    // Kalau tidak ada tahap 2 → poin dari tahap1
    if (!ind.tahap2 || !ind.tahap2.items || !ind.tahap2.items.length) {
      this.poinFinal = item.poin !== null && item.poin !== undefined ? item.poin : (Number(this.selectedKategori.poin_default) || 0);
      tahap2Wrap.style.display = 'none';
      poinWrap.style.display = 'block';
      $('#poinInput').value = this.poinFinal;
      this._autoFillDeskripsi();
      return;
    }

    // Ada tahap 2 → render
    $('#tahap2Label').textContent = ind.tahap2.tipe;
    this._renderTingkat('tahap2List', ind.tahap2.items, (item2) => {
      this.pilihanTahap2 = item2.label;
      this.poinFinal = item2.poin !== null && item2.poin !== undefined ? item2.poin : (Number(this.selectedKategori.poin_default) || 0);
      poinWrap.style.display = 'block';
      $('#poinInput').value = this.poinFinal;
      this._autoFillDeskripsi();
    });
    tahap2Wrap.style.display = 'block';
    poinWrap.style.display = 'none';
    this.pilihanTahap2 = null;
  }

  _autoFillDeskripsi() {
    const deskripsiEl = $('#deskripsiInput');
    if (!deskripsiEl) return;
    const parts = [];
    if (this.pilihanTahap1) parts.push(this.pilihanTahap1);
    if (this.pilihanTahap2) parts.push(this.pilihanTahap2);
    if (parts.length) deskripsiEl.value = parts.join(' - ');
  }

  _updateKatTriggerUI() {
    const trigger = $('#katTrigger');
    const ph = $('#katPlaceholder');
    const lbl = $('#katLabel');
    const meta = $('#katMeta');
    const poin = $('#katPoin');
    const kat = this.selectedKategori;
    if (!kat) {
      trigger.classList.remove('active');
      ph.style.display = '';
      lbl.style.display = 'none';
      meta.style.display = 'none';
      poin.style.display = 'none';
      return;
    }
    const p = Number(kat.poin_default) || 0;
    const sign = p > 0 ? '+' : '';
    const cls = p > 0 ? 'pos' : (p < 0 ? 'neg' : '');
    trigger.classList.add('active');
    ph.style.display = 'none';
    lbl.style.display = 'block';
    lbl.textContent = kat.nama_kategori;
    meta.style.display = 'flex';
    const ind = kat.indikator || {};
    const info = ind.tipe ? `${ind.items?.length || 0} ${ind.tipe.toLowerCase()}` : 'Tanpa tingkat';
    meta.innerHTML = `${escapeHtml(kat.jenis)} • ${info}`;
    poin.style.display = 'inline-flex';
    poin.className = `kat-poin ${cls}`;
    poin.textContent = `${sign}${p}`;
  }

  async _onKelas(kelas) {
    this.csSiswa.disable();
    if (!kelas) { this.csSiswa.setOptions([], '-- Pilih Kelas Dulu --'); return; }
    this.csSiswa.setOptions([], 'Memuat siswa...');
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const res = await Api.getSiswaKelas(kelas);
        const list = normalizeList(res, 'data');
        if (list.length) { this.csSiswa.setOptions(list.map(s => ({ value: s.id, label: s.nama })), '-- Pilih Siswa --'); this.csSiswa.enable(); return; }
      } catch (_) {}
      if (attempt === 0) await sleep(600);
    }
    showToast('Siswa tidak termuat. Ketuk ulang Kelas untuk coba lagi.', 'error');
    this.csSiswa.setOptions([], '-- Ketuk Kelas untuk muat ulang --');
  }

  async _save() {
    const id_siswa = this.csSiswa.getValue();
    if (!id_siswa) return showToast('Pilih siswa.', 'error');
    if (!this.selectedKategori) return showToast('Pilih kategori.', 'error');

    const ind = this.selectedKategori.indikator || {};
    const adaTingkat = ind.tipe && ind.items && ind.items.length > 0;
    const adaTahap2 = ind.tahap2 && ind.tahap2.items && ind.tahap2.items.length > 0;

    if (adaTingkat && !this.pilihanTahap1) return showToast(`Pilih ${ind.tipe} terlebih dahulu.`, 'error');
    if (adaTahap2 && !this.pilihanTahap2) return showToast(`Pilih ${ind.tahap2.tipe} terlebih dahulu.`, 'error');

    const deskripsi = $('#deskripsiInput').value.trim();
    if (!deskripsi) return showToast('Deskripsi harus diisi.', 'error');

    const id_guru = sessionStorage.getItem(SSKeys.GURU_ID);
    if (!id_guru) return showToast('Sesi habis, silakan login ulang.', 'error');

    const btn = $('#btnSimpan');
    setLoading(btn, true, 'Menyimpan...');
    try {
      const res = await Api.addPerilaku({
        id_siswa,
        tanggal: $('#tanggalInput').value,
        jenis: $('input[name="jenis"]:checked', this.el).value,
        id_kategori: parseInt(this.selectedKategori.id),
        deskripsi,
        pilihan_tahap1: this.pilihanTahap1 || '',
        pilihan_tahap2: this.pilihanTahap2 || '',
        poin: this.poinFinal,
        id_guru
      });
      if (res?.error) throw new Error(res.error);
      showToast('Catatan berhasil disimpan.', 'success');
      this.csSiswa.setValue('', '-- Pilih Siswa --');
      this._resetKategoriState();
      $('#deskripsiInput').value = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      showToast(err.message || 'Gagal menyimpan catatan.', 'error');
    } finally {
      setLoading(btn, false);
    }
  }
}

/* ==================== RIWAYAT ==================== */
class RiwayatTab {
  constructor(el) { this.el = el; this._loaded = false; this.siswaAktif = null; }
  init() {
    if (this._loaded) return;
    this._loaded = true;
    this.el.innerHTML = `
      <h2 class="section-title">📋 Riwayat Siswa</h2>
      <div class="search-bar">
        <input type="text" id="cariInput" class="input-modern" placeholder="Ketik Nama Siswa..." autocomplete="off">
        <button class="btn-modern" id="btnCari" style="width:auto;padding:0 1rem" aria-label="Cari"><span class="material-symbols-outlined">search</span></button>
      </div>
      <div id="profilWrap"></div>
      <div id="filterWrap" class="filter-box" style="display:none">
        <div id="csFilterWrap"></div>
        <button id="btnFilter" class="btn-modern"><span class="material-symbols-outlined">filter_list</span> Filter</button>
        <input type="date" id="tglMulai" title="Dari">
        <input type="date" id="tglSampai" title="Sampai">
      </div>
      <div id="riwayatWrap"><div class="empty-state"><span class="material-symbols-outlined">person_search</span><p>Masukkan nama siswa.</p></div></div>`;
    this.csFilter = new CustomSelect('csFilterWrap', { placeholder: 'Semua Jenis' });
    this.csFilter.setOptions([{ value: 'Positif', label: 'Positif' }, { value: 'Negatif', label: 'Negatif' }], 'Semua Jenis');
    const doSearch = debounce(() => this._cari(), 350);
    $('#cariInput').addEventListener('input', doSearch);
    $('#cariInput').addEventListener('keypress', e => { if (e.key === 'Enter') this._cari(); });
    $('#btnCari').onclick = () => this._cari();
    $('#btnFilter').onclick = () => this.siswaAktif && this._load(this.siswaAktif.id);
  }
  async _cari() {
    const q = $('#cariInput').value.trim();
    if (!q) return;
    const c = $('#riwayatWrap');
    c.innerHTML = `<div class="empty-state"><span class="material-symbols-outlined spinner-dark" style="animation:spin 1s linear infinite">progress_activity</span><p>Mencari...</p></div>`;
    $('#profilWrap').innerHTML = ''; $('#filterWrap').style.display = 'none';
    try {
      const res = await Api.cariSiswa(q);
      const list = normalizeList(res, 'data');
      if (!list.length) { showToast('Siswa tidak ditemukan.', 'error'); c.innerHTML = `<div class="empty-state"><span class="material-symbols-outlined">sentiment_dissatisfied</span><p>Tidak ditemukan.</p></div>`; return; }
      if (list.length === 1) this._showProfil(list[0]);
      else this._showList(list);
    } catch { showToast('Gagal mencari.', 'error'); }
  }
  _showList(list) {
    const c = $('#riwayatWrap');
    $('#profilWrap').innerHTML = ''; $('#filterWrap').style.display = 'none';
    c.innerHTML = `
      <div style="margin-bottom:1rem;padding:.8rem;background:var(--primary-light);border-radius:var(--radius-sm)"><strong>${list.length} siswa ditemukan.</strong> Klik untuk melihat riwayat.</div>
      <div style="display:flex;flex-direction:column;gap:.6rem">
        ${list.map(s => {
          const ini = (s.nama || '?').trim().charAt(0).toUpperCase();
          return `<div class="history-card" style="cursor:pointer" data-id="${escapeHtml(s.id)}" data-nama="${escapeHtml(s.nama)}" data-kelas="${escapeHtml(s.kelas)}">
            <div style="display:flex;align-items:center;gap:.8rem">
              <div class="avatar-circle" style="width:40px;height:40px;font-size:.9rem;background:var(--primary);color:#fff;border:none">${ini}</div>
              <div style="min-width:0;flex:1"><div style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(s.nama)}</div><div style="font-size:.85rem;color:var(--text-muted)">Kelas ${escapeHtml(s.kelas)}</div></div>
              <span style="color:var(--primary)" class="material-symbols-outlined">chevron_right</span>
            </div>
          </div>`;
        }).join('')}
      </div>`;
    $$('.history-card', c).forEach(card => {
      card.onclick = () => this._showProfil({ id: card.dataset.id, nama: card.dataset.nama, kelas: card.dataset.kelas });
    });
  }
  _showProfil(s) {
    this.siswaAktif = s;
    const ini = (s.nama || '?').trim().charAt(0).toUpperCase();
    $('#profilWrap').innerHTML = `
      <div class="profil-card">
        <div class="profil-left">
          <div class="avatar-circle">${ini}</div>
          <div class="profil-info"><div class="nama">${escapeHtml(s.nama)}</div><div class="detail">Kelas ${escapeHtml(s.kelas)}</div></div>
        </div>
        <div class="poin-total"><div class="angka" id="totalPoin">…</div><div class="label">TOTAL POIN</div></div>
      </div>`;
    $('#filterWrap').style.display = 'grid';
    this._load(s.id);
  }
  async _load(id) {
    const c = $('#riwayatWrap');
    c.innerHTML = `<div class="empty-state"><span class="material-symbols-outlined spinner-dark" style="animation:spin 1s linear infinite">progress_activity</span><p>Memuat riwayat...</p></div>`;
    const filter = { jenis: this.csFilter.getValue(), tgl_mulai: $('#tglMulai').value, tgl_sampai: $('#tglSampai').value };
    try {
      const res = await Api.riwayat(id, filter);
      const list = normalizeList(res, 'data');
      let total = 0;
      if (!list.length) { c.innerHTML = `<div class="empty-state"><span class="material-symbols-outlined">inbox</span><p>Belum ada catatan.</p></div>`; $('#totalPoin').textContent = '0'; return; }
      c.innerHTML = list.map(it => {
        total += it.poin || 0;
        const jenisLow = it.jenis_lower || ((it.jenis === 'Positif') ? 'positif' : 'negatif');
        const isPos = jenisLow === 'positif';
        const badge = isPos ? 'positif' : 'negatif';
        const sign = it.poin > 0 ? '+' : '';
        const ind = it.indikator_terpilih?.length
          ? `<div class="hc-indikator"><strong>Detail:</strong><ul>${it.indikator_terpilih.map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul></div>`
          : '';
        return `<div class="history-card">
          <div class="hc-header"><div class="hc-date"><span class="material-symbols-outlined">calendar_today</span> ${fmtDate(it.tanggal)}</div><div class="badge ${badge}">${sign}${it.poin} Poin</div></div>
          <div class="hc-kat">${escapeHtml(it.nama_kategori || '-')}</div>
          <div class="hc-desc">"${escapeHtml(it.deskripsi)}"</div>
          ${ind}
          <div class="hc-footer"><span>Oleh: <strong>${escapeHtml(it.pencatat)}</strong></span><span style="color:${isPos ? 'var(--positive)' : 'var(--negative)'};font-weight:600">${escapeHtml(it.jenis)}</span></div>
        </div>`;
      }).join('');
      $('#totalPoin').textContent = total;
    } catch { showToast('Gagal memuat riwayat.', 'error'); }
  }
}

/* ==================== LAPORAN ==================== */
class LaporanTab {
  constructor(el) { this.el = el; this._loaded = false; this.kelas = []; }
  async init() {
    if (this._loaded) return;
    this.el.innerHTML = `<div class="empty-state"><span class="material-symbols-outlined spinner-dark" style="animation:spin 1s linear infinite">progress_activity</span><p>Menyiapkan...</p></div>`;
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const res = await Api.getKelas();
        const list = normalizeList(res, 'kelas');
        if (list.length) { this.kelas = list; saveToLocal(LSKeys.KELAS, list); break; }
      } catch (_) {}
      if (attempt === 0) await sleep(700);
    }
    if (!this.kelas.length) { const c = loadFromLocal(LSKeys.KELAS); if (c.length) this.kelas = c; }
    this._render();
    this._loaded = true;
  }
  _render() {
    this.el.innerHTML = `
      <h2 class="section-title no-print">🖨️ Cetak Laporan</h2>
      <div class="laporan-control no-print">
        <div class="full">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem">
            <label style="margin:0">Pilih Kelas</label>
            <div id="lapRetryWrap" style="display:${this.kelas.length ? 'none' : 'flex'}">
              <button type="button" class="retry-mini" id="btnRetryLaporan"><span class="material-symbols-outlined">refresh</span> Muat Ulang</button>
            </div>
          </div>
          <div id="lapKelasWrap"></div>
        </div>
        <div><label>Dari Tanggal</label><input type="date" id="lapMulai" value="${firstOfMonthYMD()}"></div>
        <div><label>Sampai Tanggal</label><input type="date" id="lapSampai" value="${todayYMD()}"></div>
        <div class="full"><label class="laporan-check"><input type="checkbox" id="lapNonaktif"><span>Tampilkan siswa non-aktif (mis. siswa lulus)</span></label></div>
        <button class="btn-modern full" id="btnLihat"><span class="material-symbols-outlined">visibility</span> Tampilkan Laporan</button>
        <button class="btn-modern full" id="btnPrint" style="background:var(--positive)"><span class="material-symbols-outlined">print</span> Cetak / Simpan PDF</button>
      </div>
      <div id="lapOutput"></div>`;
    this.csKelas = new CustomSelect('lapKelasWrap', { placeholder: 'Semua Kelas' });
    this.csKelas.setOptions(this.kelas.map(k => ({ value: k, label: `Kelas ${k}` })), this.kelas.length ? 'Semua Kelas' : 'Kelas belum tersedia');
    $('#btnLihat').onclick = () => this._load();
    $('#btnPrint').onclick = () => window.print();
    const retryBtn = $('#btnRetryLaporan');
    if (retryBtn) {
      retryBtn.onclick = async () => {
        setLoading(retryBtn, true, 'Memuat...');
        ClientCache.clear();
        try {
          const res = await Api.getKelas();
          const list = normalizeList(res, 'kelas');
          if (list.length) {
            this.kelas = list; saveToLocal(LSKeys.KELAS, list);
            this.csKelas.setOptions(list.map(k => ({ value: k, label: `Kelas ${k}` })), 'Semua Kelas');
            $('#lapRetryWrap').style.display = 'none';
            showToast(`Berhasil memuat ${list.length} kelas.`, 'success');
          } else showToast('Kelas belum tersedia.', 'error');
        } catch { showToast('Gagal memuat. Coba lagi.', 'error'); }
        finally { setLoading(retryBtn, false); }
      };
    }
  }
  async _load() {
    const btn = $('#btnLihat'); const out = $('#lapOutput');
    setLoading(btn, true, 'Memuat...');
    out.innerHTML = `<div class="empty-state"><span class="material-symbols-outlined spinner-dark" style="animation:spin 1s linear infinite">progress_activity</span><p>Menyiapkan laporan...</p></div>`;
    try {
      const res = await Api.laporan(this.csKelas.getValue(), $('#lapMulai').value, $('#lapSampai').value, $('#lapNonaktif').checked);
      if (res?.error) throw new Error(res.error);
      this._renderReport(res);
    } catch (err) { showToast(err.message || 'Gagal memuat laporan.', 'error'); out.innerHTML = `<div class="empty-state"><p>Gagal memuat laporan.</p></div>`; }
    finally { setLoading(btn, false); }
  }
  _renderReport(res) {
    const out = $('#lapOutput');
    const kelas = res.kelas || 'Semua';
    const tglMulai = res.tglMulai || '-'; const tglSampai = res.tglSampai || '-';
    const dicetak = res.dicetak || '';
    const data = res.data || []; const rk = res.ringkasan || {};
    const ttd = res.ttd || {}; const ks = ttd.kepalaSekolah || {}; const gk = ttd.guruKelas || {};
    const fmtLong = s => (s && s !== '-') ? fmtDate(s, { day:'numeric', month:'long', year:'numeric' }) : '-';
    const today = new Date().toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
    const ksNama = ks.nama ? escapeHtml(ks.nama) : '..............................';
    const ksNip = ks.nip ? escapeHtml(ks.nip) : '..............................';
    const gkNama = gk.nama ? escapeHtml(gk.nama) : '..............................';
    const gkNip = gk.nip ? escapeHtml(gk.nip) : '..............................';
    out.innerHTML = `
      <div class="print-header">
        <div class="kop">
          <img src="${LOGO_URL}" alt="Logo" onerror="this.style.display='none'">
          <div class="teks"><h2>SD NEGERI 1 GODEGAN</h2><h3>LAPORAN PERILAKU SISWA</h3><p>Kelas: ${escapeHtml(kelas)} • Periode: ${fmtLong(tglMulai)} s.d. ${fmtLong(tglSampai)}${res.includeNonAktif ? ' • (termasuk siswa non-aktif)' : ''}</p></div>
        </div>
      </div>
      <div class="laporan-summary no-print">
        <div><span class="val" style="color:var(--primary)">${rk.totalSiswa ?? data.length}</span><span class="lbl">Siswa</span></div>
        <div><span class="val" style="color:var(--positive)">${rk.totalPositif ?? 0}</span><span class="lbl">Catatan Positif</span></div>
        <div><span class="val" style="color:var(--negative)">${rk.totalNegatif ?? 0}</span><span class="lbl">Catatan Negatif</span></div>
        <div><span class="val" style="color:${(rk.rataRata ?? 0) >= 0 ? 'var(--positive)' : 'var(--negative)'}">${fmtPoin(rk.rataRata ?? 0)}</span><span class="lbl">Rata-rata Poin</span></div>
      </div>
      <div class="laporan-summary no-print" style="background:transparent;border:none;padding:0;margin-bottom:.8rem;font-size:.75rem;color:var(--text-muted);grid-template-columns:1fr"><span>Dicetak: ${escapeHtml(dicetak)}</span></div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -.5rem;padding:0 .5rem">
        <table class="laporan-table">
          <thead><tr><th style="width:40px">No</th><th>Nama Siswa</th><th style="width:60px">Kelas</th><th style="width:70px">Positif</th><th style="width:70px">Negatif</th><th style="width:80px">Total Poin</th></tr></thead>
          <tbody>
            ${data.length === 0
              ? `<tr><td colspan="6" style="text-align:center;padding:1.5rem;color:var(--text-muted)">Tidak ada data pada periode ini.</td></tr>`
              : data.map((s, i) => `<tr><td>${i+1}</td><td>${escapeHtml(s.nama)}${s.status && s.status !== 'aktif' ? ` <small style="color:var(--text-muted)">(${escapeHtml(s.status)})</small>` : ''}</td><td>${escapeHtml(s.kelas)}</td><td class="pos">${s.positif || 0}</td><td class="neg">${s.negatif || 0}</td><td class="${(s.totalPoin || 0) >= 0 ? 'pos' : 'neg'}">${fmtPoin(s.totalPoin || 0)}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
      ${data.length > 0 ? `
        <div class="laporan-ringkasan">
          <div class="rk-title"><span class="material-symbols-outlined" style="font-size:18px">analytics</span> Ringkasan Kelas</div>
          <div class="rk-grid">
            <div class="rk-item"><span class="rk-label">Jumlah Siswa</span><span class="rk-value">${rk.totalSiswa ?? data.length} orang</span></div>
            <div class="rk-item"><span class="rk-label">Siswa dengan Catatan</span><span class="rk-value">${rk.siswaDenganCatatan ?? 0} orang</span></div>
            <div class="rk-item"><span class="rk-label">Catatan Positif</span><span class="rk-value pos">${rk.totalPositif ?? 0} kejadian</span></div>
            <div class="rk-item"><span class="rk-label">Catatan Negatif</span><span class="rk-value neg">${rk.totalNegatif ?? 0} kejadian</span></div>
            <div class="rk-item"><span class="rk-label">Poin Tertinggi</span><span class="rk-value pos">${rk.poinTertinggi ? `${fmtPoin(rk.poinTertinggi.poin)} <small>(${escapeHtml(rk.poinTertinggi.nama)})</small>` : '—'}</span></div>
            <div class="rk-item"><span class="rk-label">Poin Terendah</span><span class="rk-value neg">${rk.poinTerendah ? `${fmtPoin(rk.poinTerendah.poin)} <small>(${escapeHtml(rk.poinTerendah.nama)})</small>` : '—'}</span></div>
            <div class="rk-item rk-full"><span class="rk-label">Rata-rata Poin per Siswa</span><span class="rk-value ${(rk.rataRata ?? 0) >= 0 ? 'pos' : 'neg'}">${fmtPoin(rk.rataRata ?? 0)}</span></div>
          </div>
          <div class="rk-note">* Rata-rata dihitung dari siswa yang memiliki catatan pada periode ini. Total poin tidak dijumlahkan antar-siswa karena poin bersifat individual.</div>
        </div>
      ` : ''}
      <div class="ttd-wrap">
        <div class="ttd-col"><div class="ttd-loc">&nbsp;</div><div class="ttd-label">Mengetahui,<br>Kepala Sekolah</div><div class="ttd-space"></div><div class="ttd-line">${ksNama}</div><div class="ttd-nip">NIP. ${ksNip}</div></div>
        <div class="ttd-col"><div class="ttd-loc">Godegan, ${today}</div><div class="ttd-label">Guru Kelas${kelas && kelas !== 'Semua' ? ' ' + escapeHtml(kelas) : ''}</div><div class="ttd-space"></div><div class="ttd-line">${gkNama}</div><div class="ttd-nip">NIP. ${gkNip}</div></div>
      </div>`;
  }
}

/* ==================== SERVICE WORKER (PWA) ==================== */
(function initServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol === 'file:') return;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(reg => {
        reg.addEventListener('updatefound', () => {
          const newSW = reg.installing;
          if (!newSW) return;
          newSW.addEventListener('statechange', () => {
            if (newSW.state === 'installed' && navigator.serviceWorker.controller) showToast('Versi baru tersedia. Tutup & buka ulang aplikasi.', 'success');
          });
        });
        setInterval(() => reg.update().catch(() => {}), 3600000);
      }).catch(() => {});
  });
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (refreshing) return; refreshing = true; });
})();

})();
