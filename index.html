<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />

<title>GEMBIRA - SDN 1 Godegan</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234F46E5'/%3E%3Ctext x='50' y='68' font-size='58' font-weight='800' text-anchor='middle' fill='white' font-family='Inter,sans-serif'%3EG%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
<link rel="manifest" href="./manifest.json" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="GEMBIRA" />
<meta name="application-name" content="GEMBIRA" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" />
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
:root{
  --primary:#4F46E5; --primary-dark:#4338CA; --primary-light:#EEF2FF;
  --positive:#10B981; --positive-dark:#059669; --positive-bg:#D1FAE5;
  --negative:#F43F5E; --negative-dark:#BE123C; --negative-bg:#FFE4E6;
  --bg:#F9FAFB; --surface:#FFFFFF; --surface-alt:#F3F4F6;
  --text:#111827; --text-muted:#6B7280; --border:#E5E7EB;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.1);
  --shadow-lg:0 20px 25px -5px rgba(17,24,39,.12);
  --radius:16px; --radius-sm:10px;
  --transition:.18s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;position:fixed;inset:0;overscroll-behavior-y:contain}
@supports not (height:100dvh){html,body{height:100vh}}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%,#E0E7FF 0%,#F3F4F6 38%,#F3F4F6 100%)}
body.sheet-open{overflow:hidden}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:10px}
*{scrollbar-width:thin}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeInTab{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-100%);opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

#app{width:100%;height:100vh;height:100dvh;max-width:720px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
@supports not (height:100dvh){#app{height:100vh}}

.tab-pane{display:none;animation:fadeInTab .25s ease-out}
.tab-pane.active{display:block}

.spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin .8s linear infinite;flex-shrink:0}
.spinner-dark{border-color:rgba(79,70,229,.2);border-top-color:var(--primary)}
.btn-loading{color:transparent!important;pointer-events:none;position:relative}
.btn-loading .spinner{position:absolute;top:50%;left:50%;margin:-10px 0 0 -10px}

.login-wrapper{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:1.2rem;padding-top:calc(1.2rem + env(safe-area-inset-top));padding-bottom:calc(1.2rem + env(safe-area-inset-bottom));background:var(--surface);text-align:center;overflow-y:auto;gap:.5rem;animation:fadeIn .3s;-webkit-overflow-scrolling:touch}
.logo-box{position:relative;width:min(160px,50vw);aspect-ratio:1;max-width:180px;min-width:100px;background:linear-gradient(135deg,var(--primary),#818CF8);border-radius:24px;display:flex;justify-content:center;align-items:center;color:#fff;overflow:hidden;flex-shrink:0}
.logo-box .material-symbols-outlined{font-size:clamp(48px,15vw,72px);opacity:.2;z-index:1}
.logo-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--surface);padding:10%;z-index:2}
.app-subtitle{font-size:clamp(.85rem,3.5vw,1rem);color:var(--text-muted);margin-bottom:.5rem;line-height:1.3}
.login-fields{display:flex;flex-direction:column;gap:.5rem;width:100%;margin-bottom:.5rem}
.login-fields input{margin-bottom:0}
.input-modern{width:100%;padding:.85rem 1rem;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:16px;background:var(--bg);transition:var(--transition);outline:none}
.input-modern:focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 4px var(--primary-light)}
.input-modern.caps{text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.btn-modern{width:100%;padding:.85rem;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:clamp(.9rem,2.5vw,1rem);font-weight:600;transition:var(--transition);display:inline-flex;justify-content:center;align-items:center;gap:.5rem;min-height:44px;touch-action:manipulation}
.btn-modern:hover:not(:disabled){background:var(--primary-dark)}
.btn-modern:active:not(:disabled){transform:scale(.98)}
.btn-modern:disabled{opacity:.7;cursor:not-allowed}
.login-desc-box{margin-top:.8rem;padding:1rem;background:var(--primary-light);border:1px dashed #A5B4FC;border-radius:var(--radius-sm);text-align:left;width:100%}
.login-desc-box h3{font-size:clamp(.8rem,2vw,.9rem);color:var(--primary-dark);margin-bottom:.3rem;display:flex;align-items:center;gap:.3rem}
.login-desc-box p{font-size:clamp(.75rem,2vw,.85rem);color:var(--text-muted);line-height:1.5}
.login-desc-box code{background:#fff;padding:.1rem .4rem;border-radius:4px;font-family:ui-monospace,monospace;font-size:.75rem;color:var(--primary-dark);font-weight:600}
@media(max-width:480px){.login-wrapper{justify-content:flex-start;padding-top:calc(1.5rem + env(safe-area-inset-top))}.logo-box{width:min(110px,40vw)}.app-subtitle{font-size:.8rem;margin-bottom:.3rem}}
@media(max-height:600px){.login-wrapper{justify-content:flex-start;padding-top:calc(.8rem + env(safe-area-inset-top))}.logo-box{width:min(80px,25vw)}.app-subtitle{display:none}}

.app-header{background:var(--surface);padding:.75rem 1.1rem;padding-top:calc(.75rem + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0;z-index:10;gap:.5rem}
.app-header .head-left{display:flex;align-items:center;gap:.6rem;min-width:0;flex:1}
.app-header h1{font-size:clamp(.95rem,2.8vw,1.05rem);font-weight:800;color:var(--primary);line-height:1.1}
.app-header .head-sub{font-size:.7rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;margin-top:.1rem}
.header-logo{position:relative;width:clamp(28px,4vw,36px);height:clamp(28px,4vw,36px);border-radius:9px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--primary-light);flex-shrink:0}
.header-logo .material-symbols-outlined{font-size:clamp(16px,2.5vw,22px);color:var(--primary)}
.header-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2px;background:#fff;z-index:2}
.btn-icon{background:transparent;border:none;color:var(--text-muted);padding:.5rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transition:var(--transition);flex-shrink:0;min-width:44px;min-height:44px;touch-action:manipulation}
.btn-icon:hover{background:var(--negative-bg);color:var(--negative)}
@media(max-width:480px){.app-header{padding:.7rem .9rem;padding-top:calc(.7rem + env(safe-area-inset-top))}.app-header h1{font-size:.95rem}.app-header .head-sub{font-size:.65rem;max-width:140px}.header-logo{width:30px;height:30px}}

.main-content{flex:1;overflow-y:auto;padding:1rem;padding-bottom:calc(90px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media(max-width:480px){.main-content{padding:.85rem;padding-bottom:calc(85px + env(safe-area-inset-bottom))}}

.greeting-section{margin-bottom:1rem}
.greeting-section h2{font-size:1.3rem;font-weight:700}
.greeting-section p{color:var(--text-muted);font-size:.85rem;margin-top:.2rem}
.filter-period{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem;background:var(--surface);padding:.5rem .7rem;border-radius:var(--radius-sm);border:1px solid var(--border);align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filter-period::-webkit-scrollbar{display:none}
.filter-period .filter-label{font-size:.75rem;font-weight:600;color:var(--text-muted);flex-shrink:0;white-space:nowrap}
.filter-btn{background:transparent;border:1px solid transparent;padding:.35rem .75rem;border-radius:20px;font-size:.75rem;font-weight:500;color:var(--text-muted);transition:var(--transition);white-space:nowrap;flex-shrink:0;min-height:36px;touch-action:manipulation}
.filter-btn:hover{background:var(--primary-light);color:var(--primary)}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
@media(max-width:480px){.filter-period{flex-wrap:nowrap;padding:.5rem .65rem}.filter-btn{padding:.3rem .65rem;font-size:.72rem}}

.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;margin-bottom:1rem}
@media(min-width:600px){.stats-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem}}
.stat-card{background:var(--surface);border-radius:var(--radius-sm);padding:.85rem .9rem;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:var(--transition);min-width:0;overflow:hidden}
.stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.stat-card .stat-number{font-size:1.5rem;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.stat-card .stat-label{font-size:.78rem;color:var(--text-muted);font-weight:500;display:flex;align-items:center;gap:.3rem}
.stat-card .stat-icon{font-size:18px;color:var(--primary)}
.stat-card.positif .stat-number{color:var(--positive)}
.stat-card.negatif .stat-number{color:var(--negative)}
.stat-card.primary .stat-number{color:var(--primary)}
@media(min-width:600px){.stat-card .stat-number{font-size:1.7rem}}
@media(max-width:360px){.stat-card{padding:.7rem .75rem}.stat-card .stat-number{font-size:1.35rem}.stat-card .stat-label{font-size:.7rem}.stat-card .stat-icon{font-size:16px}}

.chart-container{background:var(--surface);border-radius:var(--radius-sm);padding:1rem .75rem;border:1px solid var(--border);margin-bottom:1rem;box-shadow:var(--shadow-sm);overflow:hidden}
.chart-container .chart-title{font-weight:600;font-size:.9rem;margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
.chart-wrapper{position:relative;height:180px;width:100%}
@media(min-width:600px){.chart-container{padding:1.1rem}.chart-wrapper{height:220px}}
@media(max-width:360px){.chart-wrapper{height:160px}}

.ranking-grid{display:grid;grid-template-columns:1fr;gap:.7rem;margin-bottom:1rem}
@media(min-width:600px){.ranking-grid{grid-template-columns:1fr 1fr}}
.ranking-card{background:var(--surface);border-radius:var(--radius-sm);padding:1rem;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.ranking-card .ranking-title{font-weight:600;font-size:.88rem;margin-bottom:.7rem;display:flex;align-items:center;gap:.4rem}
.ranking-card .ranking-title .material-symbols-outlined{font-size:20px}
.ranking-card.top .ranking-title{color:var(--positive)}
.ranking-card.bottom .ranking-title{color:var(--negative)}
.ranking-item{display:flex;align-items:center;gap:.35rem;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.82rem;min-width:0}
.ranking-item:last-child{border-bottom:none}
.ranking-item .rank-number{font-weight:700;color:var(--text-muted);width:20px;flex-shrink:0;font-variant-numeric:tabular-nums;font-size:.78rem}
.ranking-item .rank-name{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ranking-item .rank-class{font-size:.68rem;color:var(--text-muted);flex-shrink:0;white-space:nowrap}
.ranking-item .rank-poin{font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.82rem}
.ranking-item .rank-poin.positif{color:var(--positive)}
.ranking-item .rank-poin.negatif{color:var(--negative)}
@media(max-width:380px){.ranking-item .rank-class{display:none}}

.activity-section{background:var(--surface);border-radius:var(--radius-sm);padding:1rem .9rem;border:1px solid var(--border);box-shadow:var(--shadow-sm);margin-bottom:1rem}
.activity-section .section-title{font-weight:600;font-size:.9rem;margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
.activity-item{display:flex;align-items:flex-start;gap:.6rem;padding:.6rem 0;border-bottom:1px solid var(--border);min-width:0}
.activity-item:last-child{border-bottom:none}
.activity-item .activity-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;margin-top:2px}
.activity-item .activity-icon.positif{background:var(--positive-bg);color:var(--positive)}
.activity-item .activity-icon.negatif{background:var(--negative-bg);color:var(--negative)}
.activity-item .activity-content{flex:1;min-width:0;display:flex;flex-direction:column;gap:.15rem}
.activity-item .activity-content .activity-text{font-size:.82rem;line-height:1.35;word-wrap:break-word;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.activity-item .activity-content .activity-text strong{font-weight:600}
.activity-item .activity-content .activity-time{font-size:.68rem;color:var(--text-muted)}
.activity-item .activity-poin{font-weight:700;font-size:.82rem;flex-shrink:0;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.activity-item .activity-poin.positif{color:var(--positive)}
.activity-item .activity-poin.negatif{color:var(--negative)}

.section-title{font-weight:700;font-size:clamp(1rem,3vw,1.15rem);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.form-group{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem}
.form-group label{font-size:clamp(.8rem,2.2vw,.9rem);font-weight:600}
input[type="text"],input[type="password"],input[type="number"],input[type="date"],textarea{width:100%;padding:.7rem .9rem;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:16px;background:var(--surface);outline:none;transition:var(--transition);appearance:none}
input:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
input[readonly]{background:var(--surface-alt);cursor:not-allowed}
textarea{min-height:80px;resize:vertical;line-height:1.5}
.radio-card-group{display:flex;gap:.8rem}
.radio-card{flex:1;border:1px solid var(--border);border-radius:var(--radius-sm);padding:.6rem .4rem;display:flex;align-items:center;justify-content:center;gap:.3rem;cursor:pointer;transition:var(--transition);font-weight:600;font-size:clamp(.8rem,2vw,.9rem);user-select:none;min-height:48px;touch-action:manipulation}
.radio-card.selected-positif{background:var(--positive-bg);border-color:var(--positive);color:#065F46}
.radio-card.selected-negatif{background:var(--negative-bg);border-color:var(--negative);color:#9F1239}
.radio-card input{display:none}

/* ===== TINGKAT PICKER ===== */
.tingkat-list{display:flex;flex-direction:column;gap:.4rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.5rem}
.tingkat-item{display:flex;align-items:center;gap:.6rem;padding:.7rem .85rem;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;cursor:pointer;transition:var(--transition);touch-action:manipulation;min-height:52px}
.tingkat-item:hover{border-color:#C7D2FE;background:var(--primary-light)}
.tingkat-item.selected{border-color:var(--primary);background:var(--primary-light);box-shadow:0 0 0 2px var(--primary-light)}
.tingkat-item .ti-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;position:relative;transition:var(--transition)}
.tingkat-item.selected .ti-radio{border-color:var(--primary)}
.tingkat-item.selected .ti-radio::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:10px;height:10px;background:var(--primary);border-radius:50%}
.tingkat-item .ti-label{flex:1;font-size:.88rem;line-height:1.35;font-weight:500;word-break:break-word}
.tingkat-item.selected .ti-label{font-weight:600}
.tingkat-item .ti-poin{font-weight:800;font-size:.85rem;padding:.2rem .55rem;border-radius:6px;flex-shrink:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.tingkat-item .ti-poin.pos{background:var(--positive-bg);color:var(--positive)}
.tingkat-item .ti-poin.neg{background:var(--negative-bg);color:var(--negative)}
.tingkat-item .ti-poin.netral{background:var(--surface-alt);color:var(--text-muted)}
@media(max-width:480px){.tingkat-list{padding:.4rem;gap:.35rem}.tingkat-item{padding:.6rem .7rem;gap:.5rem;min-height:48px}.tingkat-item .ti-label{font-size:.82rem}.tingkat-item .ti-poin{font-size:.78rem;padding:.15rem .5rem}}

.toggle-group{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--border);padding:.8rem 1rem;border-radius:var(--radius-sm);gap:1rem;flex-direction:row}
.toggle-text{display:flex;flex-direction:column;flex:1}
.toggle-text label{font-size:clamp(.8rem,2vw,.9rem);font-weight:600;cursor:pointer}
.toggle-text .desc{font-size:clamp(.65rem,1.6vw,.75rem);color:var(--text-muted)}
.switch{position:relative;display:inline-block;width:48px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;inset:0;background:#CBD5E1;transition:.3s;border-radius:34px;cursor:pointer;box-shadow:inset 0 1px 3px rgba(0,0,0,.1)}
.slider::before{content:"";position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:#fff;transition:.3s;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch input:checked + .slider{background:var(--primary)}
.switch input:checked + .slider::before{transform:translateX(22px)}

.search-bar{display:flex;gap:.5rem;margin-bottom:1rem}
.search-bar input{flex:1;margin:0}
.profil-card{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:1rem;border-radius:var(--radius);margin-bottom:1.2rem;display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.profil-left{display:flex;align-items:center;gap:.7rem;min-width:0}
.avatar-circle{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(.9rem,2.5vw,1.1rem);flex-shrink:0}
.profil-info{min-width:0}
.profil-info .nama{font-weight:700;font-size:clamp(.9rem,2.5vw,1.05rem);margin-bottom:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profil-info .detail{font-size:clamp(.7rem,1.8vw,.8rem);opacity:.9}
.poin-total{text-align:right;flex-shrink:0}
.poin-total .angka{font-size:clamp(1.4rem,4vw,1.8rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.poin-total .label{font-size:clamp(.6rem,1.5vw,.7rem);opacity:.9;letter-spacing:.3px}
.filter-box{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1rem}
.filter-box input{padding:.6rem;font-size:15px}
.filter-box .cs-trigger{padding:.6rem .7rem;font-size:.85rem}
.filter-box .btn-modern{grid-column:span 2;padding:.6rem;font-size:.85rem}
.history-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:.8rem;box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s}

const RETRY_DELAY   = 800;

const SSKeys = {
  TOKEN:'gembira_token', GURU_ID:'gembira_guru_id', GURU_NAMA:'gembira_guru_nama',
  GURU_JABATAN:'gembira_guru_jabatan', GURU_KELAS:'gembira_guru_kelas', GURU_NIP:'gembira_guru_nip',
  LEGACY:['token','token_verified_at','token_verified_value']
};
const LSKeys = { KELAS:'gembira_kelas_cache', KATEGORI:'gembira_kategori_cache', TTL:7*24*60*60*1000 };

function clearAllSession() {
  [SSKeys.TOKEN, SSKeys.GURU_ID, SSKeys.GURU_NAMA, SSKeys.GURU_JABATAN, SSKeys.GURU_KELAS, SSKeys.GURU_NIP].forEach(k => sessionStorage.removeItem(k));
  SSKeys.LEGACY.forEach(k => sessionStorage.removeItem(k));
  ClientCache.clear();
}

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const fmtDate = (s, opt = { day:'numeric', month:'short', year:'numeric' }) => {
  if (!s || s === '-') return '-';
  try { const d = new Date(s); return isNaN(d) ? '-' : d.toLocaleDateString('id-ID', opt); } catch { return '-'; }
};
const todayYMD = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const firstOfMonthYMD = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`; };
const fmtPoin = (p) => (p > 0 ? '+' : '') + p;

function normalizeList(res, key = null) {
  if (!res) return [];
  if (Array.isArray(res)) return res;
  if (Array.isArray(res.data)) return res.data;
  if (key && Array.isArray(res[key])) return res[key];
  return [];
}
function saveToLocal(key, data) { if (!Array.isArray(data) || !data.length) return; try { localStorage.setItem(key, JSON.stringify({ data, ts: Date.now() })); } catch (_) {} }
function loadFromLocal(key) { try { const raw = localStorage.getItem(key); if (!raw) return []; const p = JSON.parse(raw); if (Date.now() - (p.ts || 0) > LSKeys.TTL) return []; return Array.isArray(p.data) ? p.data : []; } catch (_) { return []; } }

function showToast(msg, type = 'success') {
  const c = $('#toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icon = type === 'success' ? 'check_circle' : 'error';
  t.innerHTML = `<span class="material-symbols-outlined">${icon}</span><span>${escapeHtml(msg)}</span>`;
  c.appendChild(t);
  setTimeout(() => { t.classList.add('hide'); setTimeout(() => t.remove(), 300); }, 3500);
}

function setLoading(btn, on, text = '') {
  if (!btn) return;
  if (on) {
    if (!btn.dataset.orig) btn.dataset.orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> ${escapeHtml(text || 'Memuat...')}`;
    btn.classList.add('btn-loading');
  } else {
    btn.disabled = false;
    btn.classList.remove('btn-loading');
    if (btn.dataset.orig) { btn.innerHTML = btn.dataset.orig; delete btn.dataset.orig; }
  }
}

const ClientCache = {
  _store: new Map(), _inflight: new Map(),
  get(k) { const e = this._store.get(k); if (!e) return null; if (Date.now() - e.t > CACHE_TTL) { this._store.delete(k); return null; } return e.v; },
  set(k, v) {
    let kosong = false;
    if (Array.isArray(v) && v.length === 0) kosong = true;
    if (v && typeof v === 'object' && !Array.isArray(v)) {
      const keys = ['kelas','kategori','guru','data'];
      const semua = keys.filter(k2 => Array.isArray(v[k2]));
      if (semua.length && semua.every(k2 => v[k2].length === 0)) kosong = true;
    }
    if (kosong) return;
    this._store.set(k, { v, t: Date.now() });
  },
  clear() { this._store.clear(); this._inflight.clear(); }
};

const Api = {
  async request(action, body = {}, opts = {}) {
    const useCache = opts.cache !== false;
    const maxRetries = opts.retries ?? MAX_RETRIES;
    const key = `api:${action}:${JSON.stringify(body)}`;
    if (useCache) {
      const hit = ClientCache.get(key);
      if (hit) return hit;
      if (ClientCache._inflight.has(key)) return ClientCache._inflight.get(key);
    }
    const promise = (async () => {
      let lastErr = null;
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        const token = sessionStorage.getItem(SSKeys.TOKEN);
        const payload = { ...body, ...(token ? { token } : {}) };
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT);
        try {
          const res = await fetch(`${API_BASE}?action=${encodeURIComponent(action)}`, {
            method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload), signal: ctrl.signal
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (data && data.error === 'Unauthorized') {
            clearAllSession(); setTimeout(() => location.reload(), 100);
            throw new Error('Unauthorized');
          }
          if (data && data.error) { clearTimeout(timer); return data; }
          if (useCache) ClientCache.set(key, data);
          clearTimeout(timer);
          return data;
        } catch (err) {
          clearTimeout(timer); lastErr = err;
          if (err.message === 'Unauthorized') throw err;
          if (attempt < maxRetries) { await sleep(RETRY_DELAY * (attempt + 1)); continue; }
        }
      }
      throw lastErr || new Error('Gagal terhubung ke server');
    })();
    if (useCache) ClientCache._inflight.set(key, promise);
    return promise.finally(() => ClientCache._inflight.delete(key));
  },
  async loginGuru(idGuru, pin) {
    try {
      const res = await fetch(`${API_BASE}?action=login_guru`, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ id_guru: idGuru, pin })
      });
      return await res.json();
    } catch (err) { return { valid: false, error: 'Gagal terhubung ke server' }; }
  },
  bootstrap:     () => Api.request('get_bootstrap'),
  getKelas:      () => Api.request('get_kelas'),
  getKategori:   () => Api.request('get_kategori'),
  getSiswaKelas: (kelas) => Api.request('get_siswa_by_kelas', { kelas }),
  cariSiswa:     (query) => Api.request('cari_siswa', { query }),
  dashboard:     (period) => Api.request('get_dashboard_data', { period }),
  riwayat:       (id, filter = {}) => Api.request('get_riwayat_siswa', { id_siswa: id, ...filter }, { cache: false }),
  laporan:       (kelas, a, b, nonaktif = false) => Api.request('get_laporan_kelas', { kelas, tgl_mulai: a, tgl_sampai: b, include_nonaktif: nonaktif }, { cache: false }),
  addPerilaku:   (data) => { ClientCache.clear(); return Api.request('add_perilaku', data, { cache: false }); }
};

/* ==================== CUSTOM SELECT ==================== */
class CustomSelect {
  static _bound = false;
  constructor(wrapId, opts = {}) {
    this.wrap = document.getElementById(wrapId);
    if (!this.wrap) return;
    this.placeholder = opts.placeholder || '-- Pilih --';
    this.onChange = opts.onChange || null;
    this.searchable = !!opts.searchable;
    this.options = []; this.value = ''; this.disabled = false; this.isOpen = false;
    this._build();
  }
  _build() {
    this.wrap.classList.add('custom-select');
    this.wrap.innerHTML = `
      <button type="button" class="cs-trigger" aria-haspopup="listbox" aria-expanded="false">
        <span class="cs-value cs-placeholder">${escapeHtml(this.placeholder)}</span>
        <span class="material-symbols-outlined cs-chevron">expand_more</span>
      </button>
      <div class="cs-panel" role="listbox">
        ${this.searchable ? `<div class="cs-search"><input type="text" class="cs-search-input" placeholder="Cari..."></div>` : ''}
        <div class="cs-options"></div>
      </div>`;
    this.trigger = $('.cs-trigger', this.wrap);
    this.valueEl = $('.cs-value', this.wrap);
    this.panel = $('.cs-panel', this.wrap);
    this.optionsEl = $('.cs-options', this.wrap);
    this.searchInput = $('.cs-search-input', this.wrap);
    this.trigger.addEventListener('click', e => { e.stopPropagation(); if (!this.disabled) this.toggle(); });
    this.trigger.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!this.disabled) this.toggle(); }
      else if (e.key === 'Escape') this.close();
    });
    if (this.searchInput) {
      this.searchInput.addEventListener('input', () => this._filter());
      this.searchInput.addEventListener('click', e => e.stopPropagation());
    }
    if (!CustomSelect._bound) {
      document.addEventListener('click', () => { $$('.custom-select').forEach(el => el._cs?.close()); });
      CustomSelect._bound = true;
    }
    this.wrap._cs = this;
  }
  setOptions(opts, placeholder) {
    this.options = opts || [];
    if (placeholder !== undefined) this.placeholder = placeholder;
    if (!this.options.length) {
      this.optionsEl.innerHTML = `<div class="cs-empty"><span class="material-symbols-outlined">inbox</span><span>Tidak ada data</span></div>`;
    } else {
      this.optionsEl.innerHTML = this.options.map(o => `<div class="cs-option" data-value="${escapeHtml(String(o.value))}" role="option">${escapeHtml(o.label)}</div>`).join('');
      this.optionsEl.onclick = e => {
        const el = e.target.closest('.cs-option'); if (!el) return;
        const opt = this.options.find(o => String(o.value) === el.dataset.value); if (!opt) return;
        this.setValue(opt.value, opt.label); this.close(); this.onChange?.(opt.value, opt);
      };
    }
    this.setValue('', this.placeholder);
  }
  _filter() {
    const q = this.searchInput.value.toLowerCase(); let any = false;
    $$('.cs-option', this.optionsEl).forEach(el => { const m = el.textContent.toLowerCase().includes(q); el.style.display = m ? '' : 'none'; if (m) any = true; });
    let empty = $('.cs-empty-search', this.optionsEl);
    if (!any && !empty) { empty = document.createElement('div'); empty.className = 'cs-empty cs-empty-search'; empty.textContent = 'Tidak ditemukan'; this.optionsEl.appendChild(empty); }
    else if (any && empty) empty.remove();
  }
  setValue(value, label) {
    this.value = value;
    const has = value !== '' && value != null;
    this.valueEl.textContent = has ? label : this.placeholder;
    this.valueEl.classList.toggle('cs-placeholder', !has);
    $$('.cs-option', this.optionsEl).forEach(el => { el.classList.toggle('selected', has && el.dataset.value === String(value)); });
  }
  getValue() { return this.value; }
  open() {
    if (this.disabled) return;
    $$('.custom-select').forEach(el => { if (el._cs && el._cs !== this) el._cs.close(); });
    this.isOpen = true; this.panel.classList.add('open'); this.trigger.classList.add('active'); this.trigger.setAttribute('aria-expanded', 'true');
    if (this.searchInput) { this.searchInput.value = ''; this._filter(); requestAnimationFrame(() => this.searchInput.focus()); }
  }
  close() { this.isOpen = false; this.panel.classList.remove('open'); this.trigger.classList.remove('active'); this.trigger.setAttribute('aria-expanded', 'false'); }
  toggle() { this.isOpen ? this.close() : this.open(); }
  disable() { this.disabled = true; this.trigger.classList.add('disabled'); this.close(); }
  enable() { this.disabled = false; this.trigger.classList.remove('disabled'); }
}

/* ==================== CATEGORY BOTTOM SHEET ==================== */
class CategorySheet {
  constructor(opts = {}) {
    this.onSelect = opts.onSelect || null;
    this.kategori = []; this.jenis = 'Positif'; this.tab = 'all'; this.query = ''; this.selectedId = null;
    this._build();
  }
  _build() {
    if (document.getElementById('katSheetBackdrop')) return;
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="sheet-backdrop" id="katSheetBackdrop"></div>
      <div class="sheet" id="katSheet" role="dialog" aria-modal="true">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <h3>Pilih Kategori</h3>
          <button class="btn-icon" id="katSheetClose" aria-label="Tutup"><span class="material-symbols-outlined">close</span></button>
        </div>
        <div class="sheet-search">
          <span class="material-symbols-outlined">search</span>
          <input type="text" id="katSheetSearch" placeholder="Cari kategori..." autocomplete="off">
        </div>
        <div class="sheet-body" id="katSheetBody"></div>
      </div>`;
    document.body.appendChild(wrap);
    this.backdrop = document.getElementById('katSheetBackdrop');
    this.sheet = document.getElementById('katSheet');
    this.bodyEl = document.getElementById('katSheetBody');
    this.searchEl = document.getElementById('katSheetSearch');
    this.backdrop.onclick = () => this.close();
    document.getElementById('katSheetClose').onclick = () => this.close();
    this.searchEl.addEventListener('input', debounce(() => { this.query = this.searchEl.value.trim().toLowerCase(); this._render(); }, 120));
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && this.isOpen()) this.close(); });
  }
  isOpen() { return this.sheet?.classList.contains('open'); }
  open(kategori, jenis, selectedId) {
    this.kategori = Array.isArray(kategori) ? kategori : [];
    this.jenis = jenis || 'Positif';
    this.selectedId = selectedId != null ? selectedId : null;
    this.query = '';
    if (this.searchEl) this.searchEl.value = '';
    this._render();
    document.body.classList.add('sheet-open');
    requestAnimationFrame(() => { this.backdrop.classList.add('open'); this.sheet.classList.add('open'); });
    if (window.matchMedia('(hover:hover)').matches) setTimeout(() => this.searchEl?.focus(), 320);
  }
  close() { this.backdrop?.classList.remove('open'); this.sheet?.classList.remove('open'); document.body.classList.remove('sheet-open'); }
  _filtered() {
    let list = this.kategori.filter(k => k.jenis === this.jenis);
    if (this.query) {
      list = list.filter(k => k.nama_kategori.toLowerCase().includes(this.query));
    }
    return list;
  }
  _render() {
    const list = this._filtered();
    if (!list.length) {
      this.bodyEl.innerHTML = `<div class="sheet-empty"><span class="material-symbols-outlined">search_off</span><p>Tidak ada kategori yang cocok.</p></div>`;
      return;
    }
    this.bodyEl.innerHTML = `<div class="sheet-grid">${list.map(k => this._cardHtml(k)).join('')}</div>`;
    $$('.kat-card', this.bodyEl).forEach(card => {
      card.onclick = () => {
        const id = card.dataset.id;
        const kat = this.kategori.find(k => String(k.id) === id);
        if (!kat) return;
        this.selectedId = kat.id;
        this.close();
        this.onSelect?.(kat);
      };
    });
  }
  _cardHtml(k) {
    const poin = Number(k.poin_default) || 0;
    const sign = poin > 0 ? '+' : '';
    const poinCls = poin > 0 ? 'pos' : (poin < 0 ? 'neg' : '');
    const selected = this.selectedId != null && String(this.selectedId) === String(k.id);
    const ind = k.indikator || { tipe: null, items: [] };
    let metaText = '';
    if (ind.tipe && ind.items && ind.items.length) {
      metaText = `${ind.items.length} ${ind.tipe.toLowerCase()}`;
    }
    return `<button type="button" class="kat-card${selected ? ' selected' : ''}" data-id="${escapeHtml(String(k.id))}">
      <div class="kc-name">${escapeHtml(k.nama_kategori)}</div>
      <div class="kc-meta">
        <span class="kc-poin ${poinCls}">${sign}${poin}</span>
        ${metaText ? `<span class="kc-ind"><span class="material-symbols-outlined">list</span>${metaText}</span>` : ''}
      </div>
    </button>`;
  }
}

class App {
  constructor() {
    this.root = document.getElementById('app');
    this.token = sessionStorage.getItem(SSKeys.TOKEN);
    this.guru = null;
    this._logoMarkup = () => {
      const img = LOGO_URL ? `<img src="${LOGO_URL}" alt="Logo" loading="lazy" onerror="this.remove()">` : '';
      return `<span class="material-symbols-outlined">monitoring</span>${img}`;
    };
  }
  init() {
    const guruId = sessionStorage.getItem(SSKeys.GURU_ID);
    const guruNama = sessionStorage.getItem(SSKeys.GURU_NAMA);
    if (this.token && guruId && guruNama) {
      this.guru = { id: guruId, nama: guruNama, jabatan: sessionStorage.getItem(SSKeys.GURU_JABATAN) || '', kelas: sessionStorage.getItem(SSKeys.GURU_KELAS) || '', nip: sessionStorage.getItem(SSKeys.GURU_NIP) || '' };
      this._renderShell();
      this._verifySession();
    } else if (this.token) { clearAllSession(); this._renderLogin(); }
    else { this._renderLogin(); }
    try {
      const params = new URLSearchParams(location.search);
      const tab = params.get('tab');
      if (tab && ['dashboard','catat','riwayat','laporan'].includes(tab)) {
        setTimeout(() => { document.querySelector(`.nav-item[data-tab="${tab}"]`)?.click(); }, 400);
      }
    } catch (_) {}
  }
  async _verifySession() {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const res = await Api.loginGuru(this.guru.id, this.token);
        if (res && res.valid === true && res.guru) {
          const g = res.guru;
          sessionStorage.setItem(SSKeys.GURU_NAMA, g.nama);
          sessionStorage.setItem(SSKeys.GURU_JABATAN, g.jabatan || '');
          sessionStorage.setItem(SSKeys.GURU_KELAS, g.kelas || '');
          sessionStorage.setItem(SSKeys.GURU_NIP, g.nip || '');
          this.guru = g;
          return;
        }
        if (res && res.valid === false) { clearAllSession(); location.reload(); return; }
      } catch (_) {}
      if (attempt === 0) await sleep(1500);
    }
  }
  _renderLogin() {
    document.body.style.overscrollBehaviorY = 'auto';
    document.body.classList.add('login-mode');
    const uid = 'gbr_' + Math.random().toString(36).slice(2, 10);
    this.root.innerHTML = `
      <div class="login-wrapper" autocomplete="off">
        <div class="logo-box">${this._logoMarkup()}</div>
        <p class="app-subtitle">Godegan e-Monitoring Behavior<br>Integrity Record Application</p>
        <div class="login-fields" autocomplete="off" role="group" aria-label="Form login">
          <input type="text" id="idGuruInput" name="${uid}_id" class="input-modern caps" placeholder="ID Guru (contoh: G001)" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" data-form-type="other" readonly>
          <input type="password" id="pinInput" name="${uid}_pin" class="input-modern" placeholder="PIN Akses" autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="numeric" data-form-type="other" readonly>
        </div>
        <button class="btn-modern" id="btnLogin" type="button" autocomplete="off">
          <span>Masuk Aplikasi</span>
          <span class="material-symbols-outlined" style="font-size:18px">arrow_forward</span>
        </button>
        <div class="login-desc-box">
          <h3><span class="material-symbols-outlined" style="font-size:18px">info</span> Cara Login</h3>
          <p>Masukkan <b>ID Guru</b> (contoh: <code>G001</code>) dan <b>PIN</b> dari admin. Hubungi admin jika lupa PIN atau ID.</p>
        </div>
      </div>`;
    const idInp = $('#idGuruInput'); const pinInp = $('#pinInput');
    function antiAutofill(input) {
      const unlock = () => { if (input.hasAttribute('readonly')) input.removeAttribute('readonly'); };
      input.addEventListener('pointerdown', unlock, { once: true });
      input.addEventListener('touchstart', unlock, { once: true });
      input.addEventListener('mousedown', unlock, { once: true });
      input.addEventListener('keydown', unlock, { once: true });
    }
    antiAutofill(idInp); antiAutofill(pinInp);
    const clearIfAutofilled = () => { if (idInp.hasAttribute('readonly') && idInp.value) idInp.value = ''; if (pinInp.hasAttribute('readonly') && pinInp.value) pinInp.value = ''; };
    setTimeout(clearIfAutofilled, 60); setTimeout(clearIfAutofilled, 250); setTimeout(clearIfAutofilled, 600);
